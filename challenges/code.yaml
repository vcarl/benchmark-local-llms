  - name: code_caesar_cipher_bugfix
    category: code
    tier: 2
    prompt: |-
      This Caesar cipher function has bugs. Fix it:

      ```python
      def caesar_cipher(text: str, shift: int) -> str:
          result = ''
          for char in text:
              if char.isalpha():
                  base = ord('a')  # BUG: doesn't handle uppercase
                  result += chr((ord(char) - base + shift) % 26 + base)
              else:
                  result += char
          return result
      ```

      Output only the corrected function — no explanations, no markdown. Start directly with `def `.
    scorer: code_exec
    testFile: code_caesar_cipher.test.py
    tags:
      - TODO
      - code-debugging
