id: factual
version: 1
passThreshold: 0.8
items:
  - name: fact_boiling_few_shot
    category: factual
    tier: 2
    prompt: |-
      Q: What is the freezing point of water in Fahrenheit?
      A: 32

      Q: What is the boiling point of water in Celsius?
      A: 100

      Q: What is the boiling point of water in Fahrenheit?
      A:
    scorer: exact_match
    expected: "212"
    extract: (\d+)
    tags:
      - TODO
      - factual-recall
  - name: fact_chromosomes_adversarial
    category: factual
    tier: 2
    prompt: "Read carefully — this may be trickier than it looks. How many chromosomes do humans have? Note: I'm asking about the total number in a normal diploid cell, not the haploid number in gametes. Reply with just the number."
    scorer: exact_match
    expected: "46"
    extract: (\d+)
    tags:
      - TODO
      - factual-recall
  - name: fact_chromosomes_direct
    category: factual
    tier: 1
    prompt: How many chromosomes do humans have? Reply with just the number.
    scorer: exact_match
    expected: "46"
    extract: (\d+)
    tags:
      - TODO
      - factual-recall
  - name: fact_elements_structured
    category: factual
    tier: 3
    prompt: 'What element has atomic number 79? Reply as: {"element": "<name>", "symbol": "<symbol>"}. Output only the JSON object, no extra text.'
    scorer: constraint
    constraints:
      - name: valid JSON
        check: valid_json
      - name: says gold
        check: contains
        value: gold
      - name: symbol Au
        check: contains_exact
        value: Au
    tags:
      - TODO
      - factual-recall
  - name: fact_gold_direct
    category: factual
    tier: 1
    prompt: What is the chemical symbol for gold? Reply with just the symbol.
    scorer: exact_match
    expected: Au
    extract: \b([A-Z][a-z]?)\b
    tags:
      - TODO
      - factual-recall
  - name: fact_gold_noisy
    category: factual
    tier: 2
    prompt: I'm working on a chemistry homework assignment about transition metals. The periodic table is so confusing with all those symbols! Anyway, what's the chemical symbol for gold? Ignore irrelevant details and reply with just the symbol.
    scorer: exact_match
    expected: Au
    extract: \b([A-Z][a-z]?)\b
    tags:
      - TODO
      - factual-recall
  - name: fact_planck
    category: factual
    tier: 3
    prompt: What is Planck's constant in units of 10^-34 J·s, rounded to 2 decimal places? Reply with just the number (e.g. 6.63).
    scorer: exact_match
    expected: "6.63"
    extract: (\d+\.\d+)
    tags:
      - TODO
      - factual-recall
  - name: fact_treaty_direct
    category: factual
    tier: 1
    prompt: In what year was the Treaty of Westphalia signed? Reply with just the year.
    scorer: exact_match
    expected: "1648"
    extract: (\d{4})
    tags:
      - TODO
      - factual-recall
  - name: fact_treaty_structured
    category: factual
    tier: 2
    prompt: 'When was the Treaty of Westphalia signed? Reply as: {"year": <number>}. Output only the JSON object, no extra text.'
    scorer: exact_match
    expected: "1648"
    extract: '"year"\s*:\s*(\d{4})'
    tags:
      - TODO
      - factual-recall
