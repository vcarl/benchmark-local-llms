id: effect-ts
version: 1
passThreshold: 0.8
items:
  - name: effect_anti_pattern
    category: effect-ts
    tier: 2
    prompt: In Effect-TS, why is it wrong to call `Effect.runPromise` inside an `Effect.gen` block? Reply in one or two sentences.
    scorer: constraint
    constraints:
      - name: mentions breaking the chain or losing types
        check: regex
        pattern: (?i)(break|lose|bypass|escape).*(chain|type|error|composition|context|pur[ei]|transparenc)
    tags:
      - TODO
      - code-synthesis
  - name: effect_catch_specific
    category: effect-ts
    tier: 2
    prompt: In Effect-TS, you have tagged errors. What function do you use to catch a specific error by its tag, leaving other error types unhandled? Reply with just the function name like `Effect.xxx`.
    scorer: constraint
    constraints:
      - name: says Effect.catchTag
        check: contains_exact
        value: Effect.catchTag
    tags:
      - TODO
      - code-synthesis
  - name: effect_constructors_structured
    category: effect-ts
    tier: 2
    prompt: |-
      In Effect-TS, match each use case to the correct constructor:
      1. Wrap a pure value: Effect.???
      2. Create a failed Effect: Effect.???
      3. Wrap a side-effectful sync function: Effect.???
      4. Do nothing (unit): Effect.???

      Reply as JSON, using the full constructor name as each value: {"pure": "Effect.xxx", "fail": "Effect.xxx", "sync": "Effect.xxx", "unit": "Effect.xxx"}
      Output only the JSON object, no extra text.
    scorer: constraint
    constraints:
      - name: valid JSON
        check: valid_json
      - name: pure = Effect.succeed
        check: regex
        pattern: '"pure"\s*:\s*"Effect\.succeed"'
      - name: fail = Effect.fail
        check: regex
        pattern: '"fail"\s*:\s*"Effect\.fail"'
      - name: sync = Effect.sync
        check: regex
        pattern: '"sync"\s*:\s*"Effect\.sync"'
      - name: unit = Effect.void or Effect.unit
        check: regex
        pattern: '"unit"\s*:\s*"Effect\.(void|unit)"'
    tags:
      - TODO
      - code-synthesis
  - name: effect_error_class
    category: effect-ts
    tier: 1
    prompt: In Effect-TS, what base class do you extend to create a tagged error type? Reply with just the class name and module, like `Module.ClassName`.
    scorer: constraint
    constraints:
      - name: says Data.TaggedError
        check: regex
        pattern: (?i)Data\.TaggedError
    tags:
      - TODO
      - code-synthesis
  - name: effect_fiber_fork
    category: effect-ts
    tier: 3
    prompt: In Effect-TS, what function do you use to fork an Effect as a background fiber? And what function waits for a fiber to complete? Reply with both function names, one per line.
    scorer: constraint
    constraints:
      - name: mentions Effect.fork
        check: contains_exact
        value: Effect.fork
      - name: mentions Fiber.join
        check: contains_exact
        value: Fiber.join
    tags:
      - TODO
      - code-synthesis
  - name: effect_gen_pattern
    category: effect-ts
    tier: 1
    prompt: In Effect-TS, what is the function used to create an Effect from a generator function? Reply with just the function call, e.g. `SomeModule.someFunction`.
    scorer: constraint
    constraints:
      - name: says Effect.gen
        check: contains_exact
        value: Effect.gen
    tags:
      - TODO
      - code-synthesis
  - name: effect_layer
    category: effect-ts
    tier: 2
    prompt: In Effect-TS, what function constructs a Layer from a service tag and an Effect that produces the service? Reply as `Module.functionName`.
    scorer: constraint
    constraints:
      - name: says Layer.effect
        check: contains_exact
        value: Layer.effect
    tags:
      - TODO
      - code-synthesis
  - name: effect_layer_merge
    category: effect-ts
    tier: 3
    prompt: In Effect-TS, what function combines multiple independent Layers into one? Reply with just the function name like `Layer.xxx`.
    scorer: constraint
    constraints:
      - name: says Layer.mergeAll or Layer.merge
        check: regex
        pattern: (?i)Layer\.(mergeAll|merge)
    tags:
      - TODO
      - code-synthesis
  - name: effect_option_either
    category: effect-ts
    tier: 2
    prompt: In Effect-TS, what are the two main modules for representing optional values and values that can be one of two types? Reply with just the two module names, one per line.
    scorer: constraint
    constraints:
      - name: mentions Option
        check: contains_exact
        value: Option
      - name: mentions Either
        check: contains_exact
        value: Either
    tags:
      - TODO
      - code-synthesis
  - name: effect_parallel
    category: effect-ts
    tier: 2
    prompt: In Effect-TS, what function runs multiple Effects in parallel and returns all results as a tuple? Reply with just the function name like `Effect.xxx`.
    scorer: constraint
    constraints:
      - name: says Effect.all
        check: contains_exact
        value: Effect.all
    tags:
      - TODO
      - code-synthesis
  - name: effect_pipe_vs_gen
    category: effect-ts
    tier: 3
    prompt: In Effect-TS, when would you use `.pipe()` with combinators like Effect.map/Effect.flatMap versus `Effect.gen` with yield*? Reply in 2-3 sentences.
    scorer: constraint
    constraints:
      - name: mentions pipe for simple transformations
        check: regex
        pattern: (?i)(pipe|combinator).*(simple|chain|transform|short|linear)
      - name: mentions gen for complex/sequential logic
        check: regex
        pattern: (?i)(gen|generator).*(complex|sequential|multiple|step|imperative|readable)
      - name: is substantive
        check: min_length
        length: 60
    tags:
      - TODO
      - code-synthesis
  - name: effect_queue_bounded
    category: effect-ts
    tier: 2
    prompt: In Effect-TS, what function creates a bounded queue with a maximum capacity? Reply with just the function call, like `Module.functionName`.
    scorer: constraint
    constraints:
      - name: says Queue.bounded
        check: contains_exact
        value: Queue.bounded
    tags:
      - TODO
      - code-synthesis
  - name: effect_queue_operations_structured
    category: effect-ts
    tier: 3
    prompt: |-
      In Effect-TS, a Queue supports producer/consumer patterns.
      What function does a producer use to add an item?
      What function does a consumer use to take an item (blocking)?
      Reply as JSON: {"offer": "Queue.xxx", "take": "Queue.xxx"}
      Output only the JSON object, no extra text.
    scorer: constraint
    constraints:
      - name: valid JSON
        check: valid_json
      - name: offer function
        check: regex
        pattern: (?i)"offer"\s*:\s*"Queue\.offer"
      - name: take function
        check: regex
        pattern: (?i)"take"\s*:\s*"Queue\.take"
    tags:
      - TODO
      - code-synthesis
  - name: effect_ref
    category: effect-ts
    tier: 2
    prompt: In Effect-TS, the `Ref` module provides mutable references. What are the three main operations on a Ref? Reply with the function names, one per line, like `Ref.xxx`.
    scorer: constraint
    constraints:
      - name: mentions Ref.make
        check: contains_exact
        value: Ref.make
      - name: mentions Ref.get
        check: contains_exact
        value: Ref.get
      - name: mentions Ref.set or Ref.update
        check: regex
        pattern: Ref\.(set|update)
    tags:
      - TODO
      - code-synthesis
  - name: effect_resource_management
    category: effect-ts
    tier: 3
    prompt: In Effect-TS, what function provides a safe acquire/use/release pattern for resource management? Reply with just the function name like `Effect.xxx`.
    scorer: constraint
    constraints:
      - name: says acquireUseRelease or acquireRelease
        check: regex
        pattern: (?i)Effect\.(acquireUseRelease|acquireRelease)
    tags:
      - TODO
      - code-synthesis
  - name: effect_schedule_types
    category: effect-ts
    tier: 3
    prompt: In Effect-TS, name 3 different Schedule types you can use for retry policies. Reply with just the names, one per line, like `Schedule.xxx`.
    scorer: constraint
    constraints:
      - name: mentions at least 2 schedule types
        check: regex_count_min
        pattern: Schedule\.\w+
        min: 2
    tags:
      - TODO
      - code-synthesis
  - name: effect_schema
    category: effect-ts
    tier: 3
    prompt: The `effect` package exports a `Schema` module (formerly `@effect/schema`). What is its purpose? Name 2 things you can do with it. Reply in 2-3 sentences.
    scorer: constraint
    constraints:
      - name: mentions validation or parsing
        check: regex
        pattern: (?i)(validat|pars|decod|encod)
      - name: mentions schema/type definition
        check: regex
        pattern: (?i)(schema|type|defin|struct|descri)
      - name: is substantive
        check: min_length
        length: 40
    tags:
      - TODO
      - code-synthesis
  - name: effect_service_3_parts_structured
    category: effect-ts
    tier: 3
    prompt: |-
      In Effect-TS, a service has three parts. Name them in order.
      Reply as JSON: {"parts": ["first", "second", "third"]}
      Output only the JSON object, no extra text.
    scorer: constraint
    constraints:
      - name: valid JSON
        check: valid_json
      - name: mentions interface
        check: regex
        pattern: (?i)interface
      - name: mentions tag
        check: regex
        pattern: (?i)tag
      - name: mentions implementation or layer
        check: regex
        pattern: (?i)(implement|layer|live)
    tags:
      - TODO
      - code-synthesis
  - name: effect_service_pattern
    category: effect-ts
    tier: 2
    prompt: In Effect-TS, what class do you extend to create a service tag for dependency injection? Reply with just `Module.ClassName`.
    scorer: constraint
    constraints:
      - name: says Context.Tag
        check: regex
        pattern: (?i)Context\.Tag
    tags:
      - TODO
      - code-synthesis
  - name: effect_sink
    category: effect-ts
    tier: 3
    prompt: In Effect-TS, what is a `Sink` and what module is it in? What function collects all elements from a Stream into an array? Reply in 1-2 sentences.
    scorer: constraint
    constraints:
      - name: mentions Sink module
        check: contains_exact
        value: Sink
      - name: mentions collectAll or collect
        check: regex
        pattern: (?i)(collectAll|collect)
      - name: mentions consuming/processing a stream
        check: regex
        pattern: (?i)(consum|process|receiv|terminal|fold|accumulat|run)
    tags:
      - TODO
      - code-synthesis
  - name: effect_stream_create
    category: effect-ts
    tier: 2
    prompt: In Effect-TS, how do you create a Stream from an array? Reply with just the function call, like `Module.functionName`.
    scorer: constraint
    constraints:
      - name: says Stream.fromIterable
        check: regex
        pattern: (?i)Stream\.(fromIterable|from)
    tags:
      - TODO
      - code-synthesis
  - name: effect_stream_pipeline_structured
    category: effect-ts
    tier: 3
    prompt: |-
      In Effect-TS, you want to create a Stream from an array, transform each
      element with an effectful function, then collect all results into an array.
      Name the three functions you'd chain together.
      Reply as JSON: {"create": "Stream.xxx", "transform": "Stream.xxx", "collect": "xxx"}
      Output only the JSON object, no extra text.
    scorer: constraint
    constraints:
      - name: create is fromIterable or from
        check: regex
        pattern: (?i)"create"\s*:\s*"Stream\.(fromIterable|from)"
      - name: transform is mapEffect
        check: regex
        pattern: (?i)"transform"\s*:\s*"Stream\.mapEffect"
      - name: collect uses Sink or run
        check: regex
        pattern: (?i)(Sink\.collectAll|Stream\.run|runCollect)
    tags:
      - TODO
      - code-synthesis
  - name: effect_top_level_exports
    category: effect-ts
    tier: 1
    prompt: The `effect` npm package exports several top-level modules. Name at least 6 of them (e.g. Effect, Stream, ...). One per line, just the module name.
    scorer: constraint
    constraints:
      - name: lists Effect
        check: regex
        pattern: (?m)^\s*Effect\s*$
      - name: lists at least 5 valid modules
        check: regex_count_min
        pattern: (?m)^\s*(Effect|Stream|Sink|Queue|Ref|Layer|Context|Config|Schedule|Schema|Data|Option|Either|Cause|Exit|Fiber|Scope|Runtime|Match|Logger|Chunk|Duration|HashMap|HashSet|STM|PubSub|Pool|Deferred|FiberRef|Metric|Clock|Random|Order|Predicate|String|Number|Boolean|ReadonlyArray|Record|Struct|Tuple|Types|Function|Brand|Encoding|DateTime|Micro|ManagedRuntime|Mailbox|RcRef|Tracer|Cron|Inspectable|Pipeable)\s*$
        min: 5
    tags:
      - TODO
      - code-synthesis
  - name: effect_try_promise
    category: effect-ts
    tier: 2
    prompt: In Effect-TS, what function do you use to wrap a Promise-based API call into an Effect? Reply with just the function name like `Effect.xxx`.
    scorer: constraint
    constraints:
      - name: says Effect.tryPromise
        check: contains_exact
        value: Effect.tryPromise
    tags:
      - TODO
      - code-synthesis
  - name: effect_type_params
    category: effect-ts
    tier: 1
    prompt: "In Effect-TS, the type `Effect.Effect<A, E, R>` has three type parameters. What do A, E, and R represent? Reply with exactly three short phrases, one per line, in order: A, E, R."
    scorer: constraint
    constraints:
      - name: mentions success/value for A
        check: regex
        pattern: (?i)(success|result|value|output|return)
      - name: mentions error for E
        check: regex
        pattern: (?i)(error|fail)
      - name: mentions requirements/dependencies/context for R
        check: regex
        pattern: (?i)(require|depend|context|service|environment)
    tags:
      - TODO
      - code-synthesis
  - name: effect_yield_star
    category: effect-ts
    tier: 1
    prompt: In Effect-TS, what does `yield*` do inside an `Effect.gen(function* () { ... })` block? Explain in one sentence.
    scorer: constraint
    constraints:
      - name: mentions unwrapping/extracting the value or delegation/composition
        check: regex
        pattern: (?i)(unwrap|extract|get.*value|like.*await|resolv|run.*effect|delegat|compos)
      - name: is a sentence
        check: min_length
        length: 20
    tags:
      - TODO
      - code-synthesis
