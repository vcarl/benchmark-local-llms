id: logic
version: 1
passThreshold: 0.8
items:
  - name: logic_ages_cot
    category: logic
    tier: 3
    prompt: "Alice is twice as old as Bob. In 10 years, Alice will be 1.5 times as old as Bob. How old is Bob now? Think step by step, then write ANSWER: followed by the number."
    scorer: exact_match
    expected: "10"
    extract: ANSWER:\s*(\d+)
    tags:
      - TODO
      - logical-deduction
  - name: logic_bat_ball_direct
    category: logic
    tier: 1
    prompt: A bat and a ball cost $1.10 together. The bat costs $1.00 more than the ball. How much does the ball cost in cents? Reply with just the number.
    scorer: exact_match
    expected: "5"
    extract: (\d+)
    tags:
      - TODO
      - logical-deduction
  - name: logic_bat_ball_noisy
    category: logic
    tier: 2
    prompt: OK so my math teacher gave us this problem and half the class got it wrong lol. A bat and a ball cost $1.10 together and the bat is $1.00 more than the ball. Everyone keeps saying 10 cents but that's wrong right?? What does the ball actually cost in cents? Ignore irrelevant details and focus on the core question. Just the number.
    scorer: exact_match
    expected: "5"
    extract: (\d+)
    tags:
      - TODO
      - logical-deduction
  - name: logic_door_structured
    category: logic
    tier: 3
    prompt: |-
      There are 3 doors. Behind one is a prize. You pick door 1.
      The host (who knows what's behind each door) opens door 3, showing no prize.
      Should you switch to door 2 or stay with door 1?
      Reply as: {"action": "switch" or "stay", "reason": "one sentence"}
    scorer: constraint
    constraints:
      - name: valid JSON
        check: valid_json
      - name: says switch
        check: contains
        value: switch
    tags:
      - TODO
      - logical-deduction
  - name: logic_sequence
    category: logic
    tier: 3
    prompt: "What is the next number in this sequence: 1, 1, 2, 3, 5, 8, 13, 21, __? Reply with just the number."
    scorer: exact_match
    expected: "34"
    extract: (\d+)
    tags:
      - TODO
      - logical-deduction
