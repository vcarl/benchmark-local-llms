      Give your answer as a decimal to 4 places.
    scorer: constraint
    constraints:
      - name: equals 0.0508
        check: regex
        pattern: (?<![\d.])0?\.05080*(?!\d)
    tags:
      - TODO
      - financial-model
      - covenant
      - min-growth
  # NPV(A) = −1000 + 600/1.08 + 500/1.08² + 200/1.08³ = 142.99.
  - name: financial_npv_project_a
    category: financial
    tier: 3
    prompt: >-
      You must choose between two mutually exclusive three-year projects. All
      cash flows occur at year-end. Project A: invest $1,000 now (year 0), then
      receive $600 in year 1, $500 in year 2, and $200 in year 3. Project B:
      invest $1,000 now, then receive $200 in year 1, $400 in year 2, and $800
      in year 3. Unless a part states otherwise, discount at 8% per year.


      What is the net present value of Project A at the 8% discount rate? Give
      your answer in dollars to the nearest cent.
    scorer: constraint
    constraints:
      - name: equals 142.99
        check: regex
        pattern: (?<![\d.])142\.990*(?!\d)
    tags:
      - TODO
      - financial-model
      - npv
      - discounting
