  # Shoring up bank A (the shock's entry point) absorbs the original loss and stops the cascade entirely (0 failures); any other single top-up leaves more banks failing.
  - name: financial_contagion_best_bailout
    category: financial
    tier: 4
    prompt: >-
      Five banks A, B, C, D and E are linked by interbank loans. Each holds a
      capital buffer that absorbs losses: A=$50, B=$80, C=$60, D=$300, E=$45. A
      bank defaults when its total incoming losses exceed its buffer; on default
