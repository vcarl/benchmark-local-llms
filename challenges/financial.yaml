id: financial
version: 1
passThreshold: 0.8
items:
  # At $12, Flagship survives only by underpaying Supply (best-effort), so the shortfall cascades and Brand goes negative by month 19. $13 funds the full chain — note the system breakeven ($13) exceeds Flagship's standalone breakeven ($12).
  - name: financial_breakeven_liquidity_cascade
    category: financial
    tier: 3
    prompt: >-
      A franchise group shares cash between four divisions each month.

      - Flagship: starts with $300, earns $0/month in other revenue, spends
      $600/month. It sells 50 units/month at a set price.

      - Supply: starts with $100, earns $30/month in other revenue, spends
      $50/month.

      - Brand: starts with $50, earns $20/month in other revenue, spends
      $60/month.

      - Outlet: starts with $150, earns $130/month in other revenue, spends
      $80/month.

      - Each month Outlet sends $35 to Flagship, but only as much as it can
      afford that month.

      - Each month Flagship sends $75 to Supply, but only as much as it can
      afford that month.

      - Each month Supply sends $50 to Brand, but only as much as it can afford
      that month.


      Resolve each month in this order: every division first books its other
      revenue and any sales income and pays its costs; then the transfers happen
      in the order listed above. A balance is checked at the end of the month.


      Flagship sells 50 units/month; its price is yours to set. What is the
      lowest whole-dollar price at which NO division ends any of the 24 months
      with a negative balance? Reply with only that number and no other figures.
    scorer: exact_match
    expected: "13"
    extract: (\d+)
    tags:
      - TODO
      - financial-model
      - breakeven
      - cascade
  # Source loses $10/month of its own and owes $30/month, draining itself; Mid and Tail survive only on the payments they receive. Bailing Mid or Tail leaves Source insolvent, so only a Source bailout works.
  - name: financial_bailout_target
    category: financial
    tier: 3
    prompt: >-
      Three divisions are linked by FIXED monthly obligations each must pay
      every month:

      - Source: starts with $50, earns $60/month in other revenue, spends
      $70/month.

      - Mid: starts with $30, earns $30/month in other revenue, spends
      $40/month.

      - Tail: starts with $20, earns $20/month in other revenue, spends
      $35/month.

      - Each month, Source pays $30 to Mid.

      - Each month, Mid pays $20 to Tail.


      You may give a one-time cash injection at the start to exactly ONE
      division. Which division must receive it so that no division ever ends a
      month with a negative balance over 18 months? Reply with just the division
      name.
    scorer: constraint
    constraints:
      - name: matches Source
        check: regex
        pattern: \b[Ss][Oo][Uu][Rr][Cc][Ee]\b
    tags:
      - TODO
      - financial-model
      - cascade
      - bailout
  # Source nets −$10/month and pays $30/month = −$40/month effective; over 18 months that is −$720 against a $50 start, so it needs $670 more to never dip below zero.
  - name: financial_bailout_amount
    category: financial
    tier: 3
    prompt: >-
      Three divisions are linked by FIXED monthly obligations each must pay
      every month:

      - Source: starts with $50, earns $60/month in other revenue, spends
      $70/month.

      - Mid: starts with $30, earns $30/month in other revenue, spends
      $40/month.

      - Tail: starts with $20, earns $20/month in other revenue, spends
      $35/month.

      - Each month, Source pays $30 to Mid.

      - Each month, Mid pays $20 to Tail.


      If the one-time injection at the start goes to Source, what is the
      smallest whole-dollar amount that keeps every division's balance
      non-negative for all 18 months? Reply with only that number and no other
      figures.
    scorer: exact_match
    expected: "670"
    extract: (\d+)
    tags:
      - TODO
      - financial-model
      - cascade
      - bailout
  # Senior is paid first and its $520 claim is fully covered by the $640 pool, so it receives $520.
  - name: financial_waterfall_senior_payout
    category: financial
    tier: 2
    prompt: >-
      A securitization distributes a $640 cash pool to its tranches in strict
      priority order. Each tranche is paid in full before the next receives
      anything, and no tranche is ever paid more than its claim. Claims, in
      priority order, are: Senior $520, Mezzanine $310, Junior $185. Whatever
      cash remains after all three are paid goes to the Equity tranche.


      How many dollars does the Senior tranche receive? Reply with only that
      number and no other figures.
    scorer: exact_match
    expected: "520"
    extract: (\d+)
    tags:
      - TODO
      - financial-model
      - waterfall
      - tranche-priority
