  # Month 1: NOI $130 ÷ debt service $80 = 1.625.
  - name: financial_covenant_dscr_month_1
    category: financial
    tier: 2
    prompt: >-
      A property loan carries a covenant requiring its Debt Service Coverage
      Ratio (DSCR = net operating income ÷ debt service) to stay at or above
      1.25 every month; the covenant is breached only when the DSCR falls
      strictly below 1.25 (a DSCR of exactly 1.25 passes). Net operating income
      (NOI) is $130 in month 1 and grows 2% each month thereafter, so NOI in
      month t = 130 × 1.02^(t−1). Scheduled debt service steps up over time:
      $80/month in months 1–3, $110/month in months 4–6, and $140/month in
      months 7–12. Consider the 12-month horizon.


      What is the DSCR in month 1? Give your answer as a decimal.
    scorer: constraint
    constraints:
      - name: equals 1.625
        check: regex
        pattern: (?<![\d.])1\.6250*(?!\d)
    tags:
      - TODO
      - financial-model
      - covenant
      - dscr
  # Months 1–6 clear their tiers (month 4: 130·1.02³/110 ≈ 1.25+); the month-7 step-up to $140 binds: NOI₇ = 130·1.02⁶ ≈ 146.4, /140 ≈ 1.046 < 1.25. First breach = month 7.
  - name: financial_covenant_first_breach_month
