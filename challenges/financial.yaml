      $80/month in months 1–3, $110/month in months 4–6, and $140/month in
      months 7–12. Consider the 12-month horizon.


      By the end of the 12 months, is the borrower insolvent (DSCR ever below
      1.0) or merely in breach of the covenant (DSCR below 1.25 but never below
      1.0)? Answer "insolvent" or "in breach".
    scorer: constraint
    constraints:
      - name: matches in breach
        check: regex
        pattern: \b[Ii][Nn]\s+[Bb][Rr][Ee][Aa][Cc][Hh]\b
    tags:
      - TODO
      - financial-model
      - covenant
      - classification
  # The month-7 step-up binds: 130·(1+g)⁶ ≥ 1.25·140 ⇒ g ≥ (175/130)^(1/6) − 1 ≈ 0.0508.
  - name: financial_covenant_min_growth_no_breach
    category: financial
    tier: 4
    prompt: >-
      A property loan carries a covenant requiring its Debt Service Coverage
      Ratio (DSCR = net operating income ÷ debt service) to stay at or above
