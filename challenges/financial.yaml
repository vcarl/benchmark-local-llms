  # B defaults and passes $120 to C, exceeding C's $60 buffer, so C defaults — answer: no.
  - name: financial_contagion_firm_c_survives
    category: financial
    tier: 3
    prompt: >-
      Five banks A, B, C, D and E are linked by interbank loans. Each holds a
      capital buffer that absorbs losses: A=$50, B=$80, C=$60, D=$300, E=$45. A
      bank defaults when its total incoming losses exceed its buffer; on default
      it passes the full face value of every loan it owes to its creditor (loss
      given default = 100%). The loans (debtor → creditor: amount) are: A owes B
      $100; B owes C $120; C owes E $70; D owes E $55; B owes D $40. An external
      shock hits bank A with a $120 loss. Resolve the cascade until no further
      bank defaults; if two banks would default at the same time, the one
      earlier in the order A, B, C, D, E is taken first.


      Does bank C survive the shock? Answer yes or no.
    scorer: constraint
    constraints:
      - name: matches no
        check: regex
        pattern: \b[Nn][Oo]\b
    tags:
      - TODO
      - financial-model
      - contagion
      - default-cascade
  # Strict chain: A (120>50) → B (100>80) → C (120>60) → E (70>45); D's incoming $40 < $300 survives. Order A, B, C, E.
  - name: financial_contagion_default_order
    category: financial
    tier: 4
    prompt: >-
      Five banks A, B, C, D and E are linked by interbank loans. Each holds a
      capital buffer that absorbs losses: A=$50, B=$80, C=$60, D=$300, E=$45. A
      bank defaults when its total incoming losses exceed its buffer; on default
      it passes the full face value of every loan it owes to its creditor (loss
      given default = 100%). The loans (debtor → creditor: amount) are: A owes B
      $100; B owes C $120; C owes E $70; D owes E $55; B owes D $40. An external
      shock hits bank A with a $120 loss. Resolve the cascade until no further
      bank defaults; if two banks would default at the same time, the one
      earlier in the order A, B, C, D, E is taken first.


      List every bank that defaults, in the order they fail, from first to last.
      Give the bank letters in order.
    scorer: ordered_match
    vocabulary:
      - A
      - B
      - C
      - D
      - E
    expected:
      - A
      - B
      - C
      - E
    tags:
      - TODO
      - financial-model
      - contagion
      - ordered
      - default-order
