id: economics
version: 1
passThreshold: 0.8
items:
  # Confess beats Stay silent in both columns (3>2 if they stay silent, 1>0 if they confess), so it strictly dominates whatever the other does.
  - name: econ_dominant_strategy
    category: economics
    tier: 2
    prompt: >-
      Two suspects are interrogated separately. Payoffs are years of freedom
      gained (higher is better):

      (payoffs shown as You, Them)

      - If You plays Stay silent — Stay silent: (2, 2); Confess: (0, 3)

      - If You plays Confess — Stay silent: (3, 0); Confess: (1, 1)


      What is your strictly dominant strategy — the choice that is better no
      matter what Them does? Reply with just that choice.
    scorer: constraint
    constraints:
      - name: matches Confess
        check: regex
        pattern: \b[Cc][Oo][Nn][Ff][Ee][Ss][Ss]\b
    tags:
      - TODO
      - game-theory
      - dominant-strategy
  # Both Confess: given the other confesses, 1>0 makes confessing each player's best reply, so neither can profitably deviate. Mutual silence pays more jointly but is unstable.
  - name: econ_nash_equilibrium
    category: economics
    tier: 3
    prompt: >-
      Two suspects are interrogated separately. Payoffs are years of freedom
      gained (higher is better):

      (payoffs shown as You, Them)

      - If You plays Stay silent — Stay silent: (2, 2); Confess: (0, 3)

      - If You plays Confess — Stay silent: (3, 0); Confess: (1, 1)


      In the game's only Nash equilibrium, what does each suspect do? Reply with
      just that one choice.
    scorer: constraint
    constraints:
      - name: matches Confess
        check: regex
        pattern: \b[Cc][Oo][Nn][Ff][Ee][Ss][Ss]\b
    tags:
      - TODO
      - game-theory
      - nash-equilibrium
  # Opportunity cost of one barrel of wine: Borland 1 cloth (6/6) vs Atland 2 cloth (20/10). Lower cost ⇒ Borland — even though Atland is absolutely more productive.
  - name: econ_comparative_advantage
    category: economics
    tier: 3
    prompt: In one day Atland can produce 10 barrels of wine OR 20 bolts of cloth.
      Borland can produce 6 barrels of wine OR 6 bolts of cloth. Which country
      holds the comparative advantage in wine (gives up less cloth per barrel)?
      Reply with just the country name.
    scorer: constraint
    constraints:
      - name: matches Borland
        check: regex
        pattern: \b[Bb][Oo][Rr][Ll][Aa][Nn][Dd]\b
    tags:
      - TODO
      - economics
      - comparative-advantage
  # Truthful bidding is weakly dominant in a second-price auction — bid your value, 80. Shading down only risks losing a profitable win; bidding up only risks overpaying.
  - name: econ_vickrey_bid
    category: economics
    tier: 2
    prompt: In a sealed-bid, second-price (Vickrey) auction the winner pays the
      second-highest bid. Your private value for the item is $80. What single
      bid is your weakly dominant strategy, in dollars? Reply with only that
      number and no other figures.
    scorer: exact_match
    expected: "80"
    extract: (\d+)
    tags:
      - TODO
      - economics
      - auctions
  # A binding ceiling (below equilibrium) raises quantity demanded and cuts quantity supplied, so demand outstrips supply ⇒ persistent shortage.
  - name: econ_price_ceiling
    category: economics
    tier: 1
    prompt: A government sets a price ceiling BELOW the market equilibrium price for
      bread. In a competitive market, does this create a persistent shortage or
      a persistent surplus? Answer in one word.
    scorer: constraint
    constraints:
      - name: matches shortage
        check: regex
        pattern: \b[Ss][Hh][Oo][Rr][Tt][Aa][Gg][Ee]\b
    tags:
      - TODO
      - economics
      - price-controls
  # %ΔQ = −10/200 = −5%; %ΔP = +1/4 = +25%; elasticity = |−5% / 25%| = 0.2.
  - name: econ_elasticity_value
    category: economics
    tier: 2
    prompt: When the price of coffee rises from $4 to $5, the quantity demanded
      falls from 200 to 190 cups/day. Using the simple percentage-change method
      (changes relative to the initial values), what is the price elasticity of
      demand, as a positive decimal? Reply with just the number (e.g. 0.5).
    scorer: constraint
    constraints:
      - name: equals 0.2
        check: regex
        pattern: (?<![\d.])0?\.20*(?!\d)
    tags:
      - TODO
      - economics
      - elasticity
  # Elasticity is 0.2 (< 1): quantity changes less than proportionally to price, so demand is inelastic.
  - name: econ_elasticity_classify
    category: economics
    tier: 1
    prompt: When the price of coffee rises from $4 to $5, the quantity demanded
      falls from 200 to 190 cups/day. Over this range, is demand elastic or
      inelastic? Answer in one word.
    scorer: constraint
    constraints:
      - name: matches inelastic
        check: regex
        pattern: \b[Ii][Nn][Ee][Ll][Aa][Ss][Tt][Ii][Cc]\b
    tags:
      - TODO
      - economics
      - elasticity
  # Produce each unit whose marginal cost ≤ $10: units 1–4 ($3,5,7,9) qualify; unit 5 ($11) exceeds MR. Optimal quantity 4.
  - name: econ_marginal_quantity
    category: economics
    tier: 2
    prompt: "A firm sells every unit for $10 (constant marginal revenue). The
      marginal cost of each successive unit is: unit 1 $3, unit 2 $5, unit 3 $7,
      unit 4 $9, unit 5 $11, unit 6 $13. How many units should it produce to
      maximise profit? Reply with only that number and no other figures."
    scorer: exact_match
    expected: "4"
    extract: (\d+)
    tags:
      - TODO
      - economics
      - marginal-analysis
  # Sunk costs are irrelevant. Forward-looking: $300 revenue − $200 to finish = +$100, so finish. The $500 already spent does not enter the decision.
  - name: econ_sunk_cost
    category: economics
    tier: 1
    prompt: You have already spent $500 developing a product (non-refundable).
      Finishing it will cost another $200, and the finished product will then
      sell for $300. Should you finish it? Answer yes or no.
    scorer: constraint
    constraints:
      - name: matches yes
        check: regex
        pattern: \b[Yy][Ee][Ss]\b
    tags:
      - TODO
      - economics
      - sunk-cost
  # Your private return is $0.30 per $1 contributed (< $1), so contributing is individually irrational — the free-rider problem — even though everyone contributing is collectively efficient.
  - name: econ_public_good_freeride
    category: economics
    tier: 2
    prompt: Ten villagers can fund a shared bridge. Every $1 anyone contributes
      creates $3 of total value, split equally among all ten — so you personally
      receive $0.30 back for every $1 you contribute. Acting purely in your own
      self-interest, do you contribute? Answer yes or no.
    scorer: constraint
    constraints:
      - name: matches no
        check: regex
        pattern: \b[Nn][Oo]\b
    tags:
      - TODO
      - economics
      - public-goods
  # Each herder internalises the gain but externalises the cost of depletion, so collectively they over-exploit — the tragedy of the commons.
  - name: econ_tragedy_commons
    category: economics
    tier: 1
    prompt: Many herders graze animals on a shared, unregulated pasture. Each adds
      more animals because they capture the full gain from each animal but share
      the cost of depletion with everyone. Left unmanaged, does the pasture tend
      toward overgrazing or toward underuse? Answer in one word.
    scorer: constraint
    constraints:
      - name: matches overgrazing
        check: regex
        pattern: \b[Oo][Vv][Ee][Rr][Gg][Rr][Aa][Zz][Ii][Nn][Gg]\b
    tags:
      - TODO
      - economics
      - externalities
  # Every cell has a profitable unilateral deviation (it cycles like matching pennies), so there is no pure-strategy Nash equilibrium — both players must randomise.
  - name: econ_mixed_has_pure_ne
    category: economics
    tier: 2
    prompt: >-
      Tennis serve, played as a one-shot simultaneous game. The Server chooses
      where to aim and the Receiver chooses where to anticipate; both decide at
      the same instant. The table shows points won per 10 rallies (Server
      points, Receiver points):

      (payoffs shown as Server, Receiver)

      - If Server plays Aim Left — Anticipate Left: (10, 2); Anticipate Right:
      (4, 8)

      - If Server plays Aim Right — Anticipate Left: (6, 6); Anticipate Right:
      (10, 2)


      Does this game have any pure-strategy Nash equilibrium — a single (aim,
      anticipate) cell that neither player would unilaterally deviate from?
      Answer yes or no.
    scorer: constraint
    constraints:
      - name: matches no
        check: regex
        pattern: \b[Nn][Oo]\b
    tags:
      - TODO
      - game-theory
      - mixed-strategy
  # The Server mixes to make the Receiver indifferent, so it is pinned by the RECEIVER's payoffs: p = (c11−c10)/(c00−c10−c01+c11) = (2−6)/(2−6−8+2) = −4/−10 = 0.4.
  - name: econ_mixed_server_prob_left
    category: economics
    tier: 3
    prompt: >-
      Tennis serve, played as a one-shot simultaneous game. The Server chooses
      where to aim and the Receiver chooses where to anticipate; both decide at
      the same instant. The table shows points won per 10 rallies (Server
      points, Receiver points):

      (payoffs shown as Server, Receiver)

      - If Server plays Aim Left — Anticipate Left: (10, 2); Anticipate Right:
      (4, 8)

      - If Server plays Aim Right — Anticipate Left: (6, 6); Anticipate Right:
      (10, 2)


      In the mixed-strategy Nash equilibrium, with what probability does the
      SERVER aim Left? Reply with just the probability as a decimal between 0
      and 1 (e.g. 0.5).
    scorer: constraint
    constraints:
      - name: equals 0.4
        check: regex
        pattern: (?<![\d.])0?\.40*(?!\d)
    tags:
      - TODO
      - game-theory
      - mixed-strategy
  # The Receiver mixes to make the Server indifferent, pinned by the SERVER's payoffs: q = (r11−r01)/(r00−r01−r10+r11) = (10−4)/(10−4−6+10) = 6/10 = 0.6.
  - name: econ_mixed_receiver_prob_left
    category: economics
    tier: 3
    prompt: >-
      Tennis serve, played as a one-shot simultaneous game. The Server chooses
      where to aim and the Receiver chooses where to anticipate; both decide at
      the same instant. The table shows points won per 10 rallies (Server
      points, Receiver points):

      (payoffs shown as Server, Receiver)

      - If Server plays Aim Left — Anticipate Left: (10, 2); Anticipate Right:
      (4, 8)

      - If Server plays Aim Right — Anticipate Left: (6, 6); Anticipate Right:
      (10, 2)


      In the mixed-strategy Nash equilibrium, with what probability does the
      RECEIVER anticipate Left? Reply with just the probability as a decimal
      between 0 and 1 (e.g. 0.5).
    scorer: constraint
    constraints:
      - name: equals 0.6
        check: regex
        pattern: (?<![\d.])0?\.60*(?!\d)
    tags:
      - TODO
      - game-theory
      - mixed-strategy
  # Value to Server = q·r00 + (1−q)·r01 = 0.6·10 + 0.4·4 = 7.6 (cross-checks against the Aim-Right row: 0.6·6 + 0.4·10 = 7.6).
  - name: econ_mixed_server_value
    category: economics
    tier: 3
    prompt: >-
      Tennis serve, played as a one-shot simultaneous game. The Server chooses
      where to aim and the Receiver chooses where to anticipate; both decide at
      the same instant. The table shows points won per 10 rallies (Server
      points, Receiver points):

      (payoffs shown as Server, Receiver)

      - If Server plays Aim Left — Anticipate Left: (10, 2); Anticipate Right:
      (4, 8)

      - If Server plays Aim Right — Anticipate Left: (6, 6); Anticipate Right:
      (10, 2)


      At the mixed-strategy equilibrium, how many points per 10 rallies does the
      Server expect to win? Reply with just the number as a decimal (e.g. 7.5).
    scorer: constraint
    constraints:
      - name: equals 7.6
        check: regex
        pattern: (?<![\d.])7\.60*(?!\d)
    tags:
      - TODO
      - game-theory
      - mixed-strategy
  # Once entry has happened, Accommodate (50) beats Fight (25), so fighting is never the Incumbent's best response. The threat is off-equilibrium and not credible: no.
  - name: econ_entry_threat_credible
    category: economics
    tier: 2
    prompt: >-
      An Entrant decides whether to Enter a market or Stay Out. If it enters,
      the Incumbent then chooses to Accommodate (share the market) or Fight (a
      price war). Payoffs are annual profits in $ thousands, written [Entrant,
      Incumbent]:

      - Entrant stays out → [0, 120]

      - Entrant enters, Incumbent accommodates → [40, 50]

      - Entrant enters, Incumbent fights → [-30, 25]


      Before play, the Incumbent announces it will Fight any entry. The Entrant
      moves first; the Incumbent observes entry before responding.


      Is the Incumbent's threat to Fight credible — would the Incumbent actually
      carry it out once the Entrant has entered? Answer yes or no.
    scorer: constraint
    constraints:
      - name: matches no
        check: regex
        pattern: \b[Nn][Oo]\b
    tags:
      - TODO
      - game-theory
      - backward-induction
  # Anticipating Accommodate, the Entrant compares Enter (40) vs Stay Out (0) and enters. SPE = (Enter, Accommodate), so the Entrant earns 40.
  - name: econ_entry_entrant_payoff
    category: economics
    tier: 3
    prompt: >-
      An Entrant decides whether to Enter a market or Stay Out. If it enters,
      the Incumbent then chooses to Accommodate (share the market) or Fight (a
      price war). Payoffs are annual profits in $ thousands, written [Entrant,
      Incumbent]:

      - Entrant stays out → [0, 120]

      - Entrant enters, Incumbent accommodates → [40, 50]

      - Entrant enters, Incumbent fights → [-30, 25]


      Before play, the Incumbent announces it will Fight any entry. The Entrant
      moves first; the Incumbent observes entry before responding.


      Solving by backward induction, what profit (in $ thousands) does the
      ENTRANT earn at the subgame-perfect equilibrium? Reply with only that
      number and no other figures.
    scorer: exact_match
    expected: "40"
    extract: (-?\d+)
    tags:
      - TODO
      - game-theory
      - backward-induction
  # At the SPE (Enter, Accommodate) the Incumbent accommodates and earns 50 — not the 120 it would keep if its non-credible Fight threat actually deterred entry.
  - name: econ_entry_incumbent_payoff
    category: economics
    tier: 3
    prompt: >-
      An Entrant decides whether to Enter a market or Stay Out. If it enters,
      the Incumbent then chooses to Accommodate (share the market) or Fight (a
      price war). Payoffs are annual profits in $ thousands, written [Entrant,
      Incumbent]:

      - Entrant stays out → [0, 120]

      - Entrant enters, Incumbent accommodates → [40, 50]

      - Entrant enters, Incumbent fights → [-30, 25]


      Before play, the Incumbent announces it will Fight any entry. The Entrant
      moves first; the Incumbent observes entry before responding.


      At the subgame-perfect equilibrium, what profit (in $ thousands) does the
      INCUMBENT earn? Reply with only that number and no other figures.
    scorer: exact_match
    expected: "50"
    extract: (-?\d+)
    tags:
      - TODO
      - game-theory
      - backward-induction
  # Stay-Out leaves the Incumbent 120; the SPE leaves it 50. The commitment value of a CREDIBLE deterrent would be 120 − 50 = 70.
  - name: econ_entry_threat_gap
    category: economics
    tier: 3
    prompt: >-
      An Entrant decides whether to Enter a market or Stay Out. If it enters,
      the Incumbent then chooses to Accommodate (share the market) or Fight (a
      price war). Payoffs are annual profits in $ thousands, written [Entrant,
      Incumbent]:

      - Entrant stays out → [0, 120]

      - Entrant enters, Incumbent accommodates → [40, 50]

      - Entrant enters, Incumbent fights → [-30, 25]


      Before play, the Incumbent announces it will Fight any entry. The Entrant
      moves first; the Incumbent observes entry before responding.


      By how much (in $ thousands) would the Incumbent's profit be HIGHER in the
      outcome its threat is meant to produce (the Entrant stays out) than in the
      subgame-perfect equilibrium it actually gets? Reply with only that number
      and no other figures.
    scorer: exact_match
    expected: "70"
    extract: (\d+)
    tags:
      - TODO
      - game-theory
      - backward-induction
  # q1 = (a − 2c1 + c2)/(3b) = (120 − 40 + 40)/3 = 40 (reaction functions q1=(100−q2)/2, q2=(80−q1)/2 give q1=40, q2=20).
  - name: econ_cournot_q1
    category: economics
    tier: 3
    prompt: >-
      Two firms compete by simultaneously choosing how much to produce (Cournot
      competition). Market inverse demand is P = 120 − Q, where Q = q1 + q2 is
      total output. Firm 1's constant marginal cost is $20 per unit; firm 2's is
      $40 per unit. There are no fixed costs.


      In the Cournot–Nash equilibrium, how many units does FIRM 1 produce? Reply
      with only that number and no other figures.
    scorer: exact_match
    expected: "40"
    extract: (\d+)
    tags:
      - TODO
      - economics
      - cournot
      - oligopoly
  # q2 = (a − 2c2 + c1)/(3b) = (120 − 80 + 20)/3 = 20 — the higher-cost firm produces less.
  - name: econ_cournot_q2
    category: economics
    tier: 3
    prompt: >-
      Two firms compete by simultaneously choosing how much to produce (Cournot
      competition). Market inverse demand is P = 120 − Q, where Q = q1 + q2 is
      total output. Firm 1's constant marginal cost is $20 per unit; firm 2's is
      $40 per unit. There are no fixed costs.


      In the Cournot–Nash equilibrium, how many units does FIRM 2 produce? Reply
      with only that number and no other figures.
    scorer: exact_match
    expected: "20"
    extract: (\d+)
    tags:
      - TODO
      - economics
      - cournot
      - oligopoly
  # Q = q1 + q2 = 40 + 20 = 60, so P = 120 − 60 = 60.
  - name: econ_cournot_price
    category: economics
    tier: 2
    prompt: >-
      Two firms compete by simultaneously choosing how much to produce (Cournot
      competition). Market inverse demand is P = 120 − Q, where Q = q1 + q2 is
      total output. Firm 1's constant marginal cost is $20 per unit; firm 2's is
      $40 per unit. There are no fixed costs.


      What is the equilibrium market price? Reply with only that number and no
      other figures.
    scorer: exact_match
    expected: "60"
    extract: (\d+)
    tags:
      - TODO
      - economics
      - cournot
      - oligopoly
  # Profit1 = (P − c1)·q1 = (60 − 20)·40 = 1600.
  - name: econ_cournot_profit1
    category: economics
    tier: 3
    prompt: >-
      Two firms compete by simultaneously choosing how much to produce (Cournot
      competition). Market inverse demand is P = 120 − Q, where Q = q1 + q2 is
      total output. Firm 1's constant marginal cost is $20 per unit; firm 2's is
      $40 per unit. There are no fixed costs.


      What is FIRM 1's equilibrium profit? Reply with only that number and no
      other figures.
    scorer: exact_match
    expected: "1600"
    extract: (\d+)
    tags:
      - TODO
      - economics
      - cournot
      - oligopoly
  # The lower-cost firm (firm 1, c=$20) produces more: 40 vs 20.
  - name: econ_cournot_which_firm
    category: economics
    tier: 1
    prompt: >-
      Two firms compete by simultaneously choosing how much to produce (Cournot
      competition). Market inverse demand is P = 120 − Q, where Q = q1 + q2 is
      total output. Firm 1's constant marginal cost is $20 per unit; firm 2's is
      $40 per unit. There are no fixed costs.


      Which firm produces more in equilibrium, firm 1 or firm 2? Reply with just
      "firm 1" or "firm 2".
    scorer: constraint
    constraints:
      - name: matches firm 1
        check: regex
        pattern: \b[Ff][Ii][Rr][Mm]\s+1\b
    tags:
      - TODO
      - economics
      - cournot
      - oligopoly
  # Pre-tax P*=(100−20)/4=20, Q*=80. The tax cuts quantity by ΔQ=βδt/(β+δ)=3·8/4=6, so Q_t=74 (Qd(26)=Qs(18)=74).
  - name: econ_tax_quantity
    category: economics
    tier: 2
    prompt: >-
      A competitive market has demand Qd = 100 − P and supply Qs = 20 + 3P (P in
      dollars). The government imposes a per-unit tax of $8.


      What is the quantity traded after the tax is imposed? Reply with only that
      number and no other figures.
    scorer: exact_match
    expected: "74"
    extract: (\d+)
    tags:
      - TODO
      - economics
      - tax-incidence
  # Pb = P* + t·δ/(β+δ) = 20 + 8·0.75 = 26.
  - name: econ_tax_buyer_price
    category: economics
    tier: 2
    prompt: >-
      A competitive market has demand Qd = 100 − P and supply Qs = 20 + 3P (P in
      dollars). The government imposes a per-unit tax of $8.


      What price do buyers pay after the tax? Reply with only that number and no
      other figures.
    scorer: exact_match
    expected: "26"
    extract: (\d+)
    tags:
      - TODO
      - economics
      - tax-incidence
  # Ps = P* − t·β/(β+δ) = 20 − 8·0.25 = 18 (check Pb − Ps = 26 − 18 = 8 = t).
  - name: econ_tax_seller_price
    category: economics
    tier: 2
    prompt: >-
      A competitive market has demand Qd = 100 − P and supply Qs = 20 + 3P (P in
      dollars). The government imposes a per-unit tax of $8.


      What price do sellers receive (net of the tax)? Reply with only that
      number and no other figures.
    scorer: exact_match
    expected: "18"
    extract: (\d+)
    tags:
      - TODO
      - economics
      - tax-incidence
  # Buyers' share = δ/(β+δ) = 3/(1+3) = 0.75. Demand is the more inelastic side (slope 1 vs 3), so buyers bear more.
  - name: econ_tax_buyer_share
    category: economics
    tier: 3
    prompt: >-
      A competitive market has demand Qd = 100 − P and supply Qs = 20 + 3P (P in
      dollars). The government imposes a per-unit tax of $8.


      What fraction of the per-unit tax is borne by buyers? Reply with just the
      share as a decimal between 0 and 1 (e.g. 0.5).
    scorer: constraint
    constraints:
      - name: equals 0.75
        check: regex
        pattern: (?<![\d.])0?\.750*(?!\d)
    tags:
      - TODO
      - economics
      - tax-incidence
  # DWL = ½·t²·βδ/(β+δ) = ½·64·(3/4) = 24 (the Harberger triangle ½·t·ΔQ = ½·8·6).
  - name: econ_tax_dwl
    category: economics
    tier: 3
    prompt: >-
      A competitive market has demand Qd = 100 − P and supply Qs = 20 + 3P (P in
      dollars). The government imposes a per-unit tax of $8.


      What is the deadweight loss caused by the tax, in dollars? Reply with only
      that number and no other figures.
    scorer: exact_match
    expected: "24"
    extract: (\d+)
    tags:
      - TODO
      - economics
      - tax-incidence
      - deadweight-loss
  # Revenue = t·Q_t = 8·74 = 592.
  - name: econ_tax_revenue
    category: economics
    tier: 3
    prompt: >-
      A competitive market has demand Qd = 100 − P and supply Qs = 20 + 3P (P in
      dollars). The government imposes a per-unit tax of $8.


      How much tax revenue does the government collect, in dollars? Reply with
      only that number and no other figures.
    scorer: exact_match
    expected: "592"
    extract: (\d+)
    tags:
      - TODO
      - economics
      - tax-incidence
  # Set MR = MC: 100 − 2Q = 10 + Q ⇒ Q* = (a−e)/(2b+f) = 90/3 = 30. (Setting P=MC instead gives the wrong 45.)
  - name: econ_monopoly_quantity
    category: economics
    tier: 3
    prompt: >-
      A monopolist faces inverse demand P = 100 − Q. Its marginal cost RISES
      with output: MC = 10 + Q. There are no fixed costs. (Recall that with
      demand P = a − bQ, marginal revenue is MR = a − 2bQ.)


      What output maximises the monopolist's profit? Reply with only that number
      and no other figures.
    scorer: exact_match
    expected: "30"
    extract: (\d+)
    tags:
      - TODO
      - economics
      - monopoly
  # P* = 100 − Q* = 100 − 30 = 70 (read off the demand curve, not MR).
  - name: econ_monopoly_price
    category: economics
    tier: 2
    prompt: >-
      A monopolist faces inverse demand P = 100 − Q. Its marginal cost RISES
      with output: MC = 10 + Q. There are no fixed costs. (Recall that with
      demand P = a − bQ, marginal revenue is MR = a − 2bQ.)


      What price does the monopolist charge? Reply with only that number and no
      other figures.
    scorer: exact_match
    expected: "70"
    extract: (\d+)
    tags:
      - TODO
      - economics
      - monopoly
  # Profit = P·Q − (eQ + ½fQ²) = 70·30 − (10·30 + ½·900) = 2100 − 750 = 1350.
  - name: econ_monopoly_profit
    category: economics
    tier: 3
    prompt: >-
      A monopolist faces inverse demand P = 100 − Q. Its marginal cost RISES
      with output: MC = 10 + Q. There are no fixed costs. (Recall that with
      demand P = a − bQ, marginal revenue is MR = a − 2bQ.)


      What is the monopolist's profit? Reply with only that number and no other
      figures.
    scorer: exact_match
    expected: "1350"
    extract: (\d+)
    tags:
      - TODO
