    scorer: exact_match
    expected: "70"
    extract: (-?\d+)
    tags:
      - TODO
      - trust
      - moral-hazard
  # Profit under high effort = 0.8·100 − 10 = 70; under low effort with a flat wage = 0.5·100 − 2 = 48. 70 > 48 — yes.
  - name: trust_hazard_worth_incentivizing
    category: social
