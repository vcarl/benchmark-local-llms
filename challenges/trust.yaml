id: trust
version: 1
passThreshold: 0.8
items:
  # Orin kept all 3 promises (3/3). Tarl 2/3, Mira 1/2, Bex 0/2 — only Orin has a perfect record.
  - name: trust_most_reliable
    category: social
    tier: 2
    prompt: >-
      Track record:

      - Tarl promised to fund the village well, and kept their word.

      - Tarl promised to share the autumn harvest, and kept their word.

      - Tarl promised to repair the old mill, then went back on it.

      - Mira promised to deliver the grain on time, and kept their word.

      - Mira promised to vote for the levy, then went back on it.

      - Bex promised to repay the loan, then went back on it.

      - Bex promised to stand the night watch, then went back on it.

      - Orin promised to garrison the bridge, and kept their word.

      - Orin promised to ransom the captives, and kept their word.

      - Orin promised to escort the caravan, and kept their word.


      Public positions:

      - Tarl came out in favour of the harbour levy.

      - Tarl came out in favour of the trade pact.

      - Tarl came out against the standing militia.

      - Orin came out in favour of the harbour levy.

      - Orin came out in favour of the trade pact.

      - Orin came out against the standing militia.

      - Mira came out in favour of the harbour levy.

      - Mira came out against the trade pact.

      - Mira came out against the standing militia.

      - Bex came out against the harbour levy.

      - Bex came out against the trade pact.

      - Bex came out in favour of the standing militia.


      Based only on this history, which person has been the most reliable at
      keeping their word? Reply with just the name.
    scorer: constraint
    constraints:
      - name: matches Orin
        check: regex
        pattern: \b[Oo][Rr][Ii][Nn]\b
    tags:
      - TODO
      - trust
      - reputation
