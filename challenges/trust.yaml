  # Rell cooperated all 5 rounds; Vane 4, Sten 1 — Rell is most cooperative.
  - name: repeated_most_cooperative
    category: social
    tier: 2
    prompt: >-
      Three traders played five rounds each; C = cooperated, D = defected.

      Rell: C C C C C

      Sten: C D D D D

      Vane: C C D C C


      Who cooperated most often across the five rounds? Reply with just the
      name.
    scorer: constraint
    constraints:
      - name: matches Rell
        check: regex
        pattern: \b[Rr][Ee][Ll][Ll]\b
    tags:
      - TODO
      - repeated-game
      - reputation
  # Tit-for-tat copies the opponent's last move; their round-5 move was D, so you defect in round 6.
  - name: repeated_tit_for_tat_next
    category: social
    tier: 2
    prompt: "You are playing tit-for-tat: cooperate in round 1, then in each later
      round copy what your opponent did in the PREVIOUS round. Over rounds 1–5
      your opponent played: C, C, D, C, D (C = cooperate, D = defect). What do
      you play in round 6 — cooperate or defect?"
    scorer: constraint
    constraints:
      - name: matches defect
        check: regex
        pattern: \b[Dd][Ee][Ff][Ee][Cc][Tt]\b
    tags:
      - TODO
      - repeated-game
      - tit-for-tat
  # Rell cooperated every round and was exploited: Rell 3 vs Sten 23. Unconditional cooperation loses against a defector.
  - name: repeated_payoff_winner
    category: social
    tier: 3
    prompt: >-
      Repeated prisoner's dilemma; each round's payoff (you, them): both
      cooperate (3,3); you cooperate–they defect (0,5); you defect–they
      cooperate (5,0); both defect (1,1).

      Over five rounds Rell: C C C C C and Sten: C D D D D.


      Who ended with the higher TOTAL payoff — Rell or Sten? Reply with just the
      name.
    scorer: constraint
    constraints:
      - name: matches Sten
        check: regex
        pattern: \b[Ss][Tt][Ee][Nn]\b
    tags:
      - TODO
      - repeated-game
      - exploitation
  # Posterior odds = (0.4/0.6)·(0.8/0.3)^4·(0.2/0.7)^2 = 32768/11907 ≈ 2.751994; P(H|data) = 32768/44675 ≈ 0.733475.
  - name: trust_bayes_posterior
    category: social
    tier: 3
    prompt: >-
      An informant, Sable, is either Honest or Dishonest. Before any dealings
      you judge the prior probability that Sable is Honest to be 0.4. Each
      report Sable files is independently rated "corroborated" (a good signal)
      or "contradicted" (a bad signal). An Honest informant's report is
      corroborated with probability 0.8; a Dishonest informant's report is
      corroborated with probability 0.30000000000000004 (so contradicted with
      probability 0.7). Reports are conditionally independent given Sable's
      type. So far Sable has filed 4 corroborated and 2 contradicted reports.


      Using Bayes' rule, what is the probability that Sable is Honest given this
      history? Answer as a decimal to 6 places.
    scorer: constraint
    constraints:
      - name: equals 0.733475
        check: regex
        pattern: (?<![\d.])0?\.7334750*(?!\d)
    tags:
      - TODO
      - trust
      - bayesian
