  # Chains S→T: S→A→T = 0.63, S→A→C→T = 0.648, S→B→T = 0.475, S→B→C→T = 0.27. Strongest = 0.648 via S→A→C→T.
  - name: trust_web_best_path_value
    category: social
    tier: 3
    prompt: >-
      In a trust network each directed link u→v carries a direct-trust weight
      between 0 and 1. Trust along a chain is the PRODUCT of its link weights;
      where several chains connect two parties, their effective trust is the
      strongest chain (the maximum product) — do not add chains together. The
      links are: S→A 0.9, S→B 0.5, A→T 0.7, A→C 0.8, C→T 0.9, B→T 0.95, B→C 0.6.


      What is the strongest-chain (maximum-product) trust from S to T? Answer as
      a decimal.
    scorer: constraint
    constraints:
      - name: equals 0.648
        check: regex
        pattern: (?<![\d.])0?\.6480*(?!\d)
    tags:
      - TODO
      - trust
      - web-of-trust
