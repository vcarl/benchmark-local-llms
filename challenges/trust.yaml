  # Temptation minus reward, T − R = 9 − 5 = 4.
  - name: trust_folk_temptation_gain
    category: social
    tier: 2
    prompt: >-
      Two rival shippers repeatedly decide each season whether to Honour a price
      agreement (cooperate) or Undercut it (defect). In a single season the
      payoffs are: both Honour → 5 each; if you Undercut while the rival Honours
      you earn 9 and the rival earns 0; if you Honour while the rival Undercuts
      you earn 0 and the rival earns 9; both Undercut → 2 each. The game repeats
      indefinitely and each shipper discounts the next season's payoff by a
      factor δ. Both follow a grim-trigger strategy: Honour every season until
      the first Undercut, then Undercut forever.


      In a single season, by how much does Undercutting beat Honouring when the
      rival Honours, before any future punishment is considered? Reply with only
      that whole number.
    scorer: exact_match
    expected: "4"
    extract: (\d+)
    tags:
      - TODO
      - trust
      - folk-theorem
