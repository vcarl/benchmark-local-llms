  # With Δ = 0, U(low) − U(high) = c_H − c_L = 10 − 2 = 8 > 0, so the artisan shirks — yes.
  - name: trust_hazard_shirk_flat_wage
    category: social
    tier: 1
    prompt: >-
      A workshop hires a risk-neutral artisan who privately chooses high or low
      effort. High effort costs the artisan 10 in disutility, low effort costs
      2. The commission turns out good with probability 0.8 under high effort
      and 0.5 under low effort; a good piece is worth 100 to the workshop and a
      bad piece 0. The contract pays a base wage on a bad outcome and the base
      wage plus a bonus Δ on a good outcome. The artisan maximises expected wage
      minus effort cost, and the workshop sets the base so the artisan's
      participation constraint binds at a reservation utility of 0.


      Under a flat wage that pays the same regardless of outcome (bonus Δ = 0),
      does the artisan choose low effort (shirk)? Answer yes or no.
    scorer: constraint
    constraints:
      - name: matches yes
        check: regex
        pattern: \b[Yy][Ee][Ss]\b
    tags:
      - TODO
      - trust
      - moral-hazard
  # Δ* = (c_H − c_L)/(p_H − p_L) = (10 − 2)/(0.8 − 0.5) = 8/0.3 ≈ 26.666667.
  - name: trust_hazard_min_bonus
    category: social
    tier: 3
    prompt: >-
