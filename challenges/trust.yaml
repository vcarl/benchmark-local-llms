        check: regex
        pattern: (?<![\d.])26\.6666670*(?!\d)
    tags:
      - TODO
      - trust
      - moral-hazard
  # With participation binding the expected wage equals c_H = 10, so profit = p_H·V_good + (1−p_H)·V_bad − c_H = 0.8·100 − 10 = 70.
  - name: trust_hazard_principal_profit
    category: social
