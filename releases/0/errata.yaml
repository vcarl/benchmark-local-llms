# Errata registry of release 0: every change to an item since its release
# file. `npm test` (src/config/errata.test.ts) fails when an item differs from
# release.json without an entry here. See docs/ERRATA.md.
#
#   id:            0.<n>, n = 1, 2, … in file order; release 0 is closed at 0.7
#   kind:          answer-key | scorer | prompt-ambiguity | retired | added
#   items:         challengeId/itemName of every affected item
#   description:   public, plain language: what was wrong and what changed
#   notes:         optional, internal technical detail (not published)
#   scorerChange:  true when the entry changed how stored outputs score
#   scorers:       with scorerChange: the scorerHash in effect after the entry,
#                  per item (its blob is in blobs/)
#   scoresChanged: { lines, configs } measured on the archive the report scores:
#                  lines whose score differs between the eval version before and
#                  after the entry, and their distinct configHashes (retired:
#                  the lines it dropped from scoring)
#   releaseStatus: none | next-release | released (+ releasedIn: <release>)
