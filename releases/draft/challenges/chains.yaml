id: chains
version: 1
passThreshold: 0.8
items:
  # Amortization schedule built one step at a time: payment → balance → payoff → interest.
  # t1: A = 20000·0.005 / (1 − 1.005^−60) = $386.66.
  # t2: 12 months of the schedule with $100 extra leaves $15230.33.
  # t3: The balance reaches zero in month 47 (vs the scheduled 60).
  # t4: Summing each month's interest through month 47 gives $2444.36.
  - name: chain_amortization
    category: financial
    tier: 4
    turns:
      - prompt: >-
          A borrower takes a $20,000 loan at 6% annual interest compounded
          monthly (a 0.5% monthly rate) on a 60-month level-payment schedule. On
          top of the scheduled payment, the borrower pays an extra $100 of
          principal every month starting in month 1. Each month interest accrues
          on the outstanding balance first, then the scheduled payment and the
          extra $100 are applied to principal. Work to exact cents; the final
          payment is whatever amount clears the remaining balance.


          What is the scheduled monthly payment (ignoring the extra principal)?
          Give your answer in dollars to the nearest cent.
        answer: "386.66"
        scorer: constraint
        constraints:
          - name: equals 386.66
            check: regex
            pattern: (?<![\d.])386\.660*(?!\d)
      - prompt: Using that scheduled payment plus the $100 extra each month, what is the
          outstanding balance immediately after the 12th monthly payment? Give
          your answer in dollars to the nearest cent.
        answer: "15230.33"
        scorer: constraint
        constraints:
          - name: equals 15230.33
            check: regex
            pattern: (?<![\d.]|\d,)(?:15,230|15230)\.330*(?!\d)
        nearMisses:
          - slip: round-at-end
            credit: 0.5
            pattern: (?<![\d.]|\d,)(?:15,230|15230)\.380*(?!\d)
      - prompt: Continuing the same schedule, in which month is the loan fully paid off?
          Reply with only the month number.
        answer: "47"
        scorer: exact_match
        expected: "47"
        extract: (\d+)
      - prompt: What is the total interest paid over the life of the loan, through that
          final payment? Give your answer in dollars to the nearest cent.
        answer: "2444.36"
        scorer: constraint
        constraints:
          - name: equals 2444.36
            check: regex
            pattern: (?<![\d.]|\d,)(?:2,444|2444)\.360*(?!\d)
        nearMisses:
          - slip: round-at-end
            credit: 0.5
            pattern: (?<![\d.]|\d,)(?:2,444|2444)\.380*(?!\d)
    tags:
      - TODO
      - financial-model
      - amortization
      - chain
    family: financial-amortization
  # Tax incidence built one step at a time: quantity → buyer price → seller price → DWL.
  # t1: Q* = 80 pre-tax; ΔQ = βδt/(β+δ) = 6, so Q_t = 74.
  # t2: Read off demand: Pb = 100 − 74 = 26.
  # t3: Ps = Pb − t = 26 − 8 = 18 (and Qs(18) = 74).
  # t4: DWL = ½·t·ΔQ = ½·8·6 = 24.
  - name: chain_tax_incidence
    category: economics
    tier: 3
    turns:
      - prompt: >-
          A competitive market has demand Qd = 100 − P and supply Qs = 20 + 3P
          (P in dollars). The government imposes a per-unit tax of $8.


          What is the quantity traded after the tax is imposed? Reply with only
          that number and no other figures.
        answer: "74"
        scorer: exact_match
        expected: "74"
        extract: (\d+)
      - prompt: At that quantity, what price do buyers pay? Reply with only that number
          and no other figures.
        answer: "26"
        scorer: exact_match
        expected: "26"
        extract: (\d+)
      - prompt: What price do sellers receive, net of the tax? Reply with only that
          number and no other figures.
        answer: "18"
        scorer: exact_match
        expected: "18"
        extract: (\d+)
      - prompt: What is the deadweight loss caused by the tax, in dollars? Reply with
          only that number and no other figures.
        answer: "24"
        scorer: exact_match
        expected: "24"
        extract: (\d+)
    tags:
      - TODO
      - economics
      - tax-incidence
      - chain
    family: econ-tax
  # Monopoly welfare built one step at a time: Q → P → profit → competitive Q → DWL.
  # t1: MR = MC: 100 − 2Q = 10 + Q ⇒ Q* = 30.
  # t2: P = 100 − 30 = 70.
  # t3: 70·30 − (10·30 + ½·30²) = 1350.
  # t4: P = MC: 100 − Q = 10 + Q ⇒ Qc = 45.
  # t5: ½·(45−30)·(P(30)−MC(30)) = 225.
  - name: chain_monopoly
    category: economics
    tier: 3
    turns:
      - prompt: >-
          A monopolist faces inverse demand P = 100 − Q. Its marginal cost RISES
          with output: MC = 10 + Q. There are no fixed costs. (Recall that with
          demand P = a − bQ, marginal revenue is MR = a − 2bQ.)


          What output maximises the monopolist's profit? Reply with only that
          number and no other figures.
        answer: "30"
        scorer: exact_match
        expected: "30"
        extract: (\d+)
      - prompt: At that output, what price does the monopolist charge? Reply with only
          that number and no other figures.
        answer: "70"
        scorer: exact_match
        expected: "70"
        extract: (\d+)
      - prompt: What is the monopolist's profit at that output and price? Reply with
          only that number and no other figures.
        answer: "1350"
        scorer: exact_match
        expected: "1350"
        extract: (\d+)
      - prompt: If this market were perfectly competitive instead (price equal to
          marginal cost), what quantity would be produced? Reply with only that
          number and no other figures.
        answer: "45"
        scorer: exact_match
        expected: "45"
        extract: (\d+)
      - prompt: What is the deadweight loss of the monopoly relative to perfect
          competition, in dollars? Reply with only that number and no other
          figures.
        answer: "225"
        scorer: exact_match
        expected: "225"
        extract: (\d+)
    tags:
      - TODO
      - economics
      - monopoly
      - chain
    family: econ-monopoly
