  # key: {"ticket_id":"T-41636","customer":"Diego Okonkwo","product":"Shelfwise","category":"feature_request","severity":"low","order_id":null}
  - name: extract_ticket_s0
    family: extract_ticket
    seed: 0
    scope: core
    category: extraction
    tier: 2
    prompt: >-
      Triage the support ticket below into JSON with exactly these keys:


      - "ticket_id": string, this ticket's id, e.g. "T-12345"

      - "customer": string, the customer's full name

      - "product": string, the product the ticket is about

      - "category": one of "billing", "bug", "account", "feature_request"

      - "severity": one of "critical" (the product is completely unavailable, or
      data was lost), "high" (something is broken and the customer has no
      workaround), "medium" (something is broken but there is a workaround),
      "low" (anything else: questions, requests, plan or account changes)

      - "order_id": string, the order id mentioned (e.g. "ORD-123456"), or null
      if none is mentioned


      Strings are copied exactly as written unless a format is given; numbers
      are JSON numbers, not strings. Reply with only the JSON object.


      ---

      Ticket T-41636

      From: diego.okonkwo@example.com


      Hello support,


      It would be great if Shelfwise could export to CSV as well as PDF. Is that
      on the roadmap? (This is unrelated to ticket T-40920, which you already
      closed. We also use Ledgerly, and that's working fine.)


      Thanks,

      Diego Okonkwo

      ---
    scorer: constraint
    constraints:
      - name: matches key
        check: json_matches
        value:
          ticket_id: T-41636
          customer: Diego Okonkwo
          product: Shelfwise
          category: feature_request
          severity: low
          order_id: null
