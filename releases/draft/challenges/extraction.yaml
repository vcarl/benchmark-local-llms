  # key: {"invoice_number":"INV-5711","vendor":"Pellucid Glassworks","issue_date":"2023-02-09","currency":"GBP","line_items":[{"description":"desk lamp","quantity":12,"unit_price":25.45},{"description":"roll of packing tape","quantity":7,"unit_price":2.82},{"description":"box of nitrile gloves","quantity":4,"unit_price":18.45}],"total":398.94}
  - name: extract_invoice_s0
    family: extract_invoice
    seed: 0
    scope: core
    category: extraction
    tier: 2
    prompt: >-
      Extract the invoice in the email below into JSON with exactly these keys:


      - "invoice_number": string, the current invoice's number, e.g. "INV-1234"

      - "vendor": string, the sending company's name

      - "issue_date": string, the date the invoice was issued, as YYYY-MM-DD

      - "currency": string, the ISO 4217 code: "USD", "EUR" or "GBP"

      - "line_items": array of {"description": string, "quantity": integer,
      "unit_price": number}, in the order listed

      - "total": number, the total due


      Strings are copied exactly as written unless a format is given; numbers
      are JSON numbers, not strings. Reply with only the JSON object.


      ---

      Hi Dana,


      Attached is invoice INV-5711 for your purchase order PO-44282. It replaces
      the draft we sent earlier as INV-5704, which you can discard. The invoice
      was issued on February 9, 2023; everything shipped on December 7, 2023.


      This covers: 12 × desk lamp at £25.45 each; 7 units of roll of packing
      tape (£2.82 per unit); box of nitrile gloves, quantity 4, unit price
      £18.45.


      The total due is £398.94, payable within 30 days.


      Best regards,

      Grace Whitfield

      Pellucid Glassworks

      ---
    scorer: constraint
    constraints:
      - name: matches key
        check: json_matches
        value:
          invoice_number: INV-5711
          vendor: Pellucid Glassworks
          issue_date: 2023-02-09
          currency: GBP
          line_items:
            - description: desk lamp
              quantity: 12
              unit_price: 25.45
            - description: roll of packing tape
              quantity: 7
              unit_price: 2.82
            - description: box of nitrile gloves
              quantity: 4
              unit_price: 18.45
          total: 398.94
