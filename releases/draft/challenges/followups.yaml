  # Orders: completed revenue, then also refunded, then broken down by status.
  # t1: key: {"West":210.44,"East":286.26,"North":246.04}
  # t2: completed + refunded: {"West":254.05,"East":394.77,"North":289.16}
  # t3: {"West":{"completed":210.44,"refunded":43.61},"East":{"completed":286.26,"refunded":108.51},"North":{"completed":246.04,"refunded":43.12}}
  - name: followup_orders_s0
    seed: 0
    scope: core
    category: transformation
    tier: 2
    turns:
      - prompt: >-
          The CSV below has a header row followed by one row per order.


          Compute the revenue per region, counting only orders whose status is
          "completed". An order's revenue is units × unit_price. Reply with only
          a JSON object mapping each region to its revenue as a number rounded
          to 2 decimal places, e.g. {"North": 1234.5}. Leave out regions with no
          completed orders.


          ```csv

          order_id,region,status,units,unit_price

          5003,West,completed,4,7.48

          5006,East,completed,4,31.91

          5007,North,completed,8,21.92

          5010,West,completed,7,21.61

          5012,North,completed,2,35.34

          5014,East,completed,2,30.44

          5017,West,refunded,1,43.61

          5020,East,refunded,3,36.17

          5023,West,completed,9,3.25

          5024,East,completed,6,16.29

          5026,North,refunded,2,21.56

          ```
        answer: |-
          ```json
          {
            "West": 210.44,
            "East": 286.26,
            "North": 246.04
          }
          ```
        scorer: constraint
        constraints:
          - name: matches key
            check: json_matches
            value:
              West: 210.44
              East: 286.26
              North: 246.04
      - prompt: Now count "refunded" orders as well as "completed" ones (still leaving
          out every other status) and recompute the revenue per region. Reply
          with only a JSON object mapping each region to its revenue as a number
          rounded to 2 decimal places. Leave out regions with no counted orders.
        answer: |-
          ```json
          {
            "West": 254.05,
            "East": 394.77,
            "North": 289.16
          }
          ```
        scorer: constraint
        constraints:
          - name: matches key
            check: json_matches
            value:
              West: 254.05
              East: 394.77
              North: 289.16
      - prompt: "Now break that revenue down by status. Reply with only a JSON object
          mapping each region to an object that maps each counted status
          (\"completed\" or \"refunded\") to that region's revenue from it,
          rounded to 2 decimal places, e.g. {\"North\": {\"completed\": 120.5,
          \"refunded\": 30}}. Leave out a status with no orders in that region."
        answer: |-
          ```json
          {
            "West": {
              "completed": 210.44,
              "refunded": 43.61
            },
            "East": {
              "completed": 286.26,
              "refunded": 108.51
            },
            "North": {
              "completed": 246.04,
              "refunded": 43.12
            }
          }
          ```
        scorer: constraint
        constraints:
          - name: matches key
            check: json_matches
            value:
              West:
                completed: 210.44
                refunded: 43.61
              East:
                completed: 286.26
                refunded: 108.51
              North:
                completed: 246.04
                refunded: 43.12
    tags:
      - chain
      - followup
    family: followup_orders
