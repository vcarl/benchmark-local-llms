id: followups
version: 1
passThreshold: 0.8
items:
  # Invoice: extract, then line totals, then drop cheap lines.
  # t1: key: {"invoice_number":"INV-5711","vendor":"Pellucid Glassworks","issue_date":"2023-02-09","currency":"GBP","line_items":[{"description":"desk lamp","quantity":12,"unit_price":25.45},{"description":"roll of packing tape","quantity":7,"unit_price":2.82},{"description":"box of nitrile gloves","quantity":4,"unit_price":18.45}],"total":398.94}
  # t2: line totals: {"desk lamp":305.4,"roll of packing tape":19.74,"box of nitrile gloves":73.8}
  # t3: cut 13: keep desk lamp, box of nitrile gloves; total 379.2
  - name: followup_invoice_s0
    seed: 0
    scope: core
    category: extraction
    tier: 2
    turns:
      - prompt: >-
          Extract the invoice in the email below into JSON with exactly these
          keys:


          - "invoice_number": string, the current invoice's number, e.g.
          "INV-1234"

          - "vendor": string, the sending company's name

          - "issue_date": string, the date the invoice was issued, as YYYY-MM-DD

          - "currency": string, the ISO 4217 code: "USD", "EUR" or "GBP"

          - "line_items": array of {"description": string, "quantity": integer,
          "unit_price": number}, in the order listed

          - "total": number, the total due


          Strings are copied exactly as written unless a format is given;
          numbers are JSON numbers, not strings. Reply with only the JSON
          object.


          ---

          Hi Dana,


          Attached is invoice INV-5711 for your purchase order PO-44282. It
          replaces the draft we sent earlier as INV-5704, which you can discard.
          The invoice was issued on February 9, 2023; everything shipped on
          December 7, 2023.


          This covers: 12 × desk lamp at £25.45 each; 7 units of roll of packing
          tape (£2.82 per unit); box of nitrile gloves, quantity 4, unit price
          £18.45.


          The total due is £398.94, payable within 30 days.


          Best regards,

          Grace Whitfield

          Pellucid Glassworks

          ---
        answer: |-
          ```json
          {
            "invoice_number": "INV-5711",
            "vendor": "Pellucid Glassworks",
            "issue_date": "2023-02-09",
            "currency": "GBP",
            "line_items": [
              {
                "description": "desk lamp",
                "quantity": 12,
                "unit_price": 25.45
              },
              {
                "description": "roll of packing tape",
                "quantity": 7,
                "unit_price": 2.82
              },
              {
                "description": "box of nitrile gloves",
                "quantity": 4,
                "unit_price": 18.45
              }
            ],
            "total": 398.94
          }
          ```
        scorer: constraint
        constraints:
          - name: matches key
            check: json_matches
            value:
              invoice_number: INV-5711
              vendor: Pellucid Glassworks
              issue_date: 2023-02-09
              currency: GBP
              line_items:
                - description: desk lamp
                  quantity: 12
                  unit_price: 25.45
                - description: roll of packing tape
                  quantity: 7
                  unit_price: 2.82
                - description: box of nitrile gloves
                  quantity: 4
                  unit_price: 18.45
              total: 398.94
      - prompt: Now give each line item's line total (quantity × unit_price). Reply with
          only a JSON object mapping each description to its line total as a
          number rounded to 2 decimal places.
        answer: |-
          ```json
          {
            "desk lamp": 305.4,
            "roll of packing tape": 19.74,
            "box of nitrile gloves": 73.8
          }
          ```
        scorer: constraint
        constraints:
          - name: matches key
            check: json_matches
            value:
              desk lamp: 305.4
              roll of packing tape: 19.74
              box of nitrile gloves: 73.8
      - prompt: Now drop every line item whose unit price is below 13 and recompute the
          total due from the lines that remain. Reply with only a JSON object
          with keys "line_items" (array of the remaining descriptions, in the
          original order) and "total" (number, rounded to 2 decimal places).
        answer: |-
          ```json
          {
            "line_items": [
              "desk lamp",
              "box of nitrile gloves"
            ],
            "total": 379.2
          }
          ```
        scorer: constraint
        constraints:
          - name: matches key
            check: json_matches
            value:
              line_items:
                - desk lamp
                - box of nitrile gloves
              total: 379.2
    tags:
      - chain
      - followup
    family: followup_invoice
