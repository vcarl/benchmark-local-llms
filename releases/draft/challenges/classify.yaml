  # Issues raised: performance, mobile_app, sign_in; mentioned as fine: docs, pricing. Keyword baseline says pricing, performance, mobile_app, docs, sign_in. gold: performance, mobile_app, sign_in
  - name: classify_topics_s0
    seed: 0
    scope: core
    category: classification
    tier: 2
    prompt: >-
      Tag the customer feedback below with every product area where the customer
      reports a problem or asks for a change. Do not tag an area they mention
      only to say it works well. Allowed tags:

      - pricing: cost and plans

      - performance: speed and responsiveness

      - mobile_app: the phone apps

      - integrations: connections to other tools

      - docs: guides and help content

      - sign_in: logging in and authentication


      """

      On iPhone the buttons at the bottom of the screen are cut off. The
      documentation has been helpful. Dashboards take ages to load once a
      project has a few hundred tasks. The reset-password link says it has
      expired as soon as I click it. The price is fair for what we get.

      """


      Reply with only the applicable tags, comma-separated on one line, written
      exactly as listed, and no other text.
    scorer: set_match
    vocabulary:
      - pricing
      - performance
      - mobile_app
      - integrations
      - docs
      - sign_in
    expected:
      - performance
      - mobile_app
      - sign_in
    tags:
      - classification
    family: classify_topics
