id: classify
version: 1
passThreshold: 0.8
items:
  # Core request is billing; distractors mention cancellation. Keyword baseline says cancellation. gold: billing
  - name: classify_intent_s0
    seed: 0
    scope: core
    category: classification
    tier: 2
    prompt: >-
      Classify the customer support ticket below by what the customer is
      actually asking for. Allowed labels:

      - billing: a question about charges, invoices or statements (no money back
      requested)

      - refund: the customer wants money returned

      - technical: something in the product is malfunctioning

      - account_access: the customer cannot sign in or get into their account

      - cancellation: the customer wants to end their subscription


      """

      Could you explain what the 'service adjustment' line on this month's
      statement is for? I don't want to cancel.

      """


      Choose exactly one label. End your reply with a final line of the form
      `Label: <label>`, with the label written exactly as listed.
    scorer: exact_match
    expected: billing
    extract: "[Ll]abel:[*\\s]*([A-Za-z0-9_]+)"
    tags:
      - classification
    family: classify_intent
