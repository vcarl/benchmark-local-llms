    category: instruction-following
    tier: 5
    prompt: >-
      Write a short piece about learning to swim as an adult. Follow every rule
      below.


      1. Begin with a markdown heading line of the form "# Title".

      2. Do not use the word "felt" anywhere.

      3. End the response with the exact phrase "More soon." and nothing after
