      4. Do not use any commas.


      Output only the piece itself.
    scorer: constraint
    constraints:
      - name: starts with heading
        check: regex
        pattern: ^\s*# \S
      - name: avoids felt
        check: regex
        pattern: (?i)^(?![\s\S]*\bfelt\b)
      - name: ends with phrase
        check: regex
        pattern: More soon\.\s*$
      - name: no commas
        check: not_contains_char
        char: ","
    tags:
      - instruction-following
    family: ifeval_stack4
    seed: 2
    scope: core
