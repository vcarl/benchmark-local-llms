  # Seeded IFEval stack (ifeval_stack3); rules: sentences, forbid, exactly.
  # gold:
  # The pool was quiet in the early evening. Kicking from the hips made the legs work better. Goggles made it easier to keep calm underwater. Fear of deep water faded with practice. The first lesson took place in the shallow end. The instructor showed how to breathe out slowly.
  - name: ifeval_stack3_s2
    category: instruction-following
    tier: 4
    prompt: >-
      Write a short piece about learning to swim as an adult. Follow every rule
      below.


      1. Write exactly 6 sentences as a single paragraph.

      2. Do not use the word "felt" anywhere.

      3. Use the word "made" exactly twice.


      Output only the piece itself.
    scorer: constraint
    constraints:
      - name: exactly 6 sentences
        check: regex
        pattern: ^\s*(?:[^.!?\s][^.!?]*[.!?]+\s*){6}$
      - name: avoids felt
        check: regex
        pattern: (?i)^(?![\s\S]*\bfelt\b)
      - name: made x2
        check: word_count_exact
        word: made
        count: 2
    tags:
      - instruction-following
    family: ifeval_stack3
    seed: 2
    scope: core
  # Seeded IFEval stack (ifeval_stack4); rules: ends, format, forbid, commas.
  # gold:
  # 1. The librarian knows most regular visitors by name.
  # 2. Old maps of the town hang near the front desk.
  # 3. The building was once a grain store.
  # 4. Children gather on the rug for stories each week.
  # 5. A reading room at the back faces a small garden.
  #
  # Thank you for reading.
  - name: ifeval_stack4
    category: instruction-following
    tier: 5
    prompt: >-
      Write a short piece about a small town library. Follow every rule below.


      1. End the response with the exact phrase "Thank you for reading." and
      nothing after it.

      2. Format the response as a numbered list of exactly 5 items (1. 2. 3. …).

      3. Do not use the word "library" anywhere.

      4. Do not use any commas.


      Output only the piece itself.
    scorer: constraint
    constraints:
      - name: ends with phrase
        check: regex
        pattern: Thank you for reading\.\s*$
      - name: numbered 1..5
        check: numbered_lines
        from: 1
        to: 5
      - name: no item 6
        check: no_numbered_line
        line: 6
      - name: avoids library
        check: regex
        pattern: (?i)^(?![\s\S]*\blibrary\b)
      - name: no commas
        check: not_contains_char
        char: ","
    tags:
      - instruction-following
    family: ifeval_stack4
    seed: 0
    scope: core
  # Seeded IFEval stack (ifeval_stack4); rules: format, forbid, include, case.
  # gold:
  # {
  #   "mood": "families walk along the harbour wall after shopping.",
  #   "summary": "gulls circle above the crowd looking for scraps.",
  #   "details": "stalls sell fruit and cheese and fresh flowers."
  # }
  - name: ifeval_stack4_s1
    category: instruction-following
    tier: 5
    prompt: >-
      Write a short piece about a weekend market by a harbour. Follow every rule
      below.


      1. Respond with only a JSON object with exactly these keys: "mood",
      "summary", "details". Every value must be a string.

      2. Do not use the word "market" anywhere.

      3. Include the word "scraps" at least once.

      4. Write the entire response in lowercase letters; no capital letters at
      all.


      Output only the piece itself.
    scorer: constraint
    constraints:
      - name: json has keys
        check: json_has_keys
        keys:
          - mood
          - summary
          - details
      - name: json values are strings
        check: json_all_string_values
      - name: avoids market
        check: regex
        pattern: (?i)^(?![\s\S]*\bmarket\b)
      - name: includes scraps
        check: regex
        pattern: \b[Ss][Cc][Rr][Aa][Pp][Ss]\b
      - name: no uppercase letters
        check: regex
        pattern: ^[^A-Z]*$
    tags:
      - instruction-following
    family: ifeval_stack4
    seed: 1
    scope: core
  # Seeded IFEval stack (ifeval_stack4); rules: heading, forbid, ends, commas.
  # gold:
  # # Learning to Swim
