id: ifeval
version: 1
passThreshold: 0.8
items:
  # Seeded IFEval stack (ifeval_stack2); rules: words, commas.
  # gold:
  # The lake below the cabin was frozen solid. Snow fell softly through most of the first night. The cabin stood at the end of a snowy track. Thick blankets lay folded on every chair. Tracks of a fox crossed the yard in the morning. Evenings passed with cards by the stove. The pantry held soup and bread and tea. The drive home was slow on the icy road.
  - name: ifeval_stack2
    category: instruction-following
    tier: 3
    prompt: >-
      Write a short piece about a weekend in a winter cabin. Follow every rule
      below.


      1. Use between 60 and 70 words in total.

      2. Do not use any commas.


      Output only the piece itself.
    scorer: constraint
    constraints:
      - name: 60-70 words
        check: regex
        pattern: ^\s*(?:\S+\s+){59,69}\S+\s*$
      - name: no commas
        check: not_contains_char
        char: ","
    tags:
      - instruction-following
    family: ifeval_stack2
    seed: 0
    scope: core
  # Seeded IFEval stack (ifeval_stack2); rules: include, ends.
  # gold:
  # The drive home was slow on the icy road. Snow fell softly through most of the first night. The pantry held soup and bread and tea. The lake below the cabin was frozen solid. Tracks of a fox crossed the yard in the morning. Thick blankets lay folded on every chair. The cabin stood at the end of a snowy track. A wood stove kept the main room warm. More soon.
  - name: ifeval_stack2_s1
    category: instruction-following
    tier: 3
    prompt: >-
      Write a short piece about a weekend in a winter cabin. Follow every rule
      below.


      1. Include the word "below" at least once.

      2. End the response with the exact phrase "More soon." and nothing after
      it.


      Output only the piece itself.
    scorer: constraint
    constraints:
      - name: includes below
        check: regex
        pattern: \b[Bb][Ee][Ll][Oo][Ww]\b
      - name: ends with phrase
        check: regex
        pattern: More soon\.\s*$
    tags:
      - instruction-following
    family: ifeval_stack2
    seed: 1
    scope: core
  # Seeded IFEval stack (ifeval_stack2); rules: case, exactly.
  # gold:
  # EACH EVENING THE BEDS NEED A GENTLE WATERING. WEEDS APPEAR ALMOST AS FAST AS THE SEEDLINGS. BEES VISIT THE FLOWERS AT THE EDGE OF THE GARDEN. PEAS CLIMB THE WIRE FENCE ALONG THE NORTH SIDE. BY LATE SPRING THE GARDEN IS GREEN AND FULL.
  - name: ifeval_stack2_s2
    category: instruction-following
    tier: 3
    prompt: >-
      Write a short piece about a vegetable garden in spring. Follow every rule
      below.


      1. Write the entire response in capital letters; no lowercase letters at
      all.

      2. Use the word "garden" exactly twice.


      Output only the piece itself.
    scorer: constraint
    constraints:
      - name: no lowercase letters
        check: regex
        pattern: ^[^a-z]*$
      - name: garden x2
        check: word_count_exact
        word: garden
        count: 2
    tags:
      - instruction-following
    family: ifeval_stack2
    seed: 2
    scope: core
  # Seeded IFEval stack (ifeval_stack3); rules: format, forbid, exactly.
  # gold:
  # - A heron stood still near the far bank.
  # - A wooden bridge crossed the river near the old mill.
  # - The air smelled of wet grass and cold stone.
  - name: ifeval_stack3
    category: instruction-following
    tier: 4
    prompt: >-
      Write a short piece about a morning walk along a river. Follow every rule
      below.


      1. Format the response as exactly 3 bullet points, each line starting with
      "- ".

      2. Do not use the word "from" anywhere.

      3. Use the word "near" exactly twice.


      Output only the piece itself.
    scorer: constraint
    constraints:
      - name: exactly 3 bullet points
        check: regex
        pattern: (?m)(?<![\s\S])(?=(?:[\s\S]*?^[-*] ){3})(?!(?:[\s\S]*?^[-*] ){4})
      - name: avoids from
        check: regex
        pattern: (?i)^(?![\s\S]*\bfrom\b)
      - name: near x2
        check: word_count_exact
        word: near
        count: 2
    tags:
      - instruction-following
    family: ifeval_stack3
    seed: 0
    scope: core
