  # 100 / (35.6·1.609344/3.785411784) = 6.607151217228464 → 6.61; slips truncated 6.60. gold: 6.61
  - name: units_conversion
    seed: 0
    scope: core
    category: units
    tier: 2
    prompt: "A car is rated at 35.6 miles per US gallon. What is its fuel
      consumption in litres per 100 km? Use 1 mile = 1.609344 km and 1 US gallon
      = 3.785411784 litres exactly. Round only the final answer to 2 decimal
      places. Work it out step by step, then write ANSWER: followed by only the
      number."
    scorer: exact_match
    expected: "6.61"
    extract: (?i)ANSWER:\*{0,2}\s*\*{0,2}(-?\d[\d,]*(?:\.\d+)?)
    fallbackExtract: (-?\d[\d,]*(?:\.\d+)?)
    tags:
      - units
    nearMisses:
      - slip: truncated
        credit: 0.5
        expected: "6.60"
    family: units_conversion
