  # UTC day difference 2024-06-13 → 2025-12-05 = 540. gold: 540
  - name: dates_days_between
    seed: 0
    scope: core
    category: dates
    tier: 2
    prompt: "How many days are there from June 13, 2024 to December 5, 2025? Count
      the difference between the two dates: the start date is day 0, so from
      January 1 to January 2 is 1 day. Work it out step by step, then write
      ANSWER: followed by only the number of days."
    scorer: exact_match
    expected: "540"
    extract: (?i)ANSWER:\*{0,2}\s*\*{0,2}(-?\d[\d,]*)
    fallbackExtract: (-?\d[\d,]*)
    tags:
      - dates
    family: dates_days_between
