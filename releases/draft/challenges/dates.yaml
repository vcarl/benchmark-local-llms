  # 20 business days after 2025-04-28 skipping weekends and 2025-05-12, 2025-05-22 = 2025-05-28 (ignoring holidays: 2025-05-26). gold: 2025-05-28
  - name: dates_business_days
    seed: 0
    scope: core
    category: dates
    tier: 2
    prompt: "A task starts on Monday, 2025-04-28. What is the date 20 business days
      later? Business days are Monday through Friday, excluding these holidays:
      Monday 2025-05-12 and Thursday 2025-05-22. The start date itself is not
      counted: one business day after a Friday is the following Monday. Work it
      out step by step, then write ANSWER: followed by only the date in
      YYYY-MM-DD format."
    scorer: exact_match
    expected: 2025-05-28
    extract: (?i)ANSWER:\*{0,2}\s*\*{0,2}(\d{4}-\d{2}-\d{2})
    fallbackExtract: (\d{4}-\d{2}-\d{2})
    tags:
      - dates
    family: dates_business_days
