  - name: codefix_max_window_sum_s0
    family: codefix_max_window_sum
    seed: 0
    scope: core
    category: code
    tier: 2
    prompt: >-
      `max_window_sum(xs, k)` returns the largest sum of any `k` consecutive
      elements of `xs`, or None when `k` is not between 1 and `len(xs)`.


      The implementation below has a bug: it fails at least one of the tests
      shown. Fix it so every test passes. The fixed function is also run against
      held-out tests of the same behavior, so fix the bug itself rather than
      special-casing these tests.


      ```python

      def max_window_sum(xs, k):
          if k <= 1 or k > len(xs):
              return None
          total = sum(xs[:k])
          best = total
          for i in range(k, len(xs)):
              total += xs[i] - xs[i - k]
              if total > best:
                  best = total
          return best
      ```


      Tests:


      ```python

      assert max_window_sum([1, 4, 2, 10, 2, 3], 2) == 12

      assert max_window_sum([5, -1, 3], 3) == 7

      assert max_window_sum([3, 8, 1], 1) == 8

      assert max_window_sum([1, 2], 0) is None

      assert max_window_sum([1, 2], 3) is None

      assert max_window_sum([-4, -2, -7], 2) == -6

      ```


