  - name: codefix_paginate_s0
    family: codefix_paginate
    seed: 0
    scope: core
    category: code
    tier: 2
    prompt: >-
      `paginate(items, page, per_page=10)` returns the items on 1-based page
      number `page` when each page holds `per_page` items. A page before the
      first or past the end is an empty list.


      The implementation below has a bug: it fails at least one of the tests
      shown. Fix it so every test passes. The fixed function is also run against
      held-out tests of the same behavior, so fix the bug itself rather than
      special-casing these tests.


      ```python

      def paginate(items, page, per_page=10):
          if page < 1:
              return []
          start = (page + 1) * per_page
          return items[start:start + per_page]
      ```


      Tests:


      ```python

      assert paginate(list(range(25)), 1) == list(range(10))

      assert paginate(list(range(25)), 3) == [20, 21, 22, 23, 24]

      assert paginate(list('abcdefg'), 2, 3) == ['d', 'e', 'f']

      assert paginate(list(range(25)), 4) == []

      assert paginate(list(range(5)), 0) == []

      ```


