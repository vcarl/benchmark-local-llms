    prompt: >-
      `binary_search(xs, target)` returns the index of `target` in the ascending
      list `xs` of distinct integers, or -1 if it is absent.


      The implementation below has a bug: it fails at least one of the tests
      shown. Fix it so every test passes. The fixed function is also run against
      held-out tests of the same behavior, so fix the bug itself rather than
      special-casing these tests.


      ```python

      def binary_search(xs, target):
          lo, hi = 0, len(xs) - 1
          while lo < hi:
              mid = (lo + hi) // 2
              if xs[mid] == target:
                  return mid
              if xs[mid] < target:
                  lo = mid + 1
              else:
                  hi = mid - 1
          return -1
      ```


      Tests:


      ```python

      assert binary_search([1, 3, 5, 7, 9], 7) == 3

      assert binary_search([1, 3, 5, 7, 9], 1) == 0

      assert binary_search([1, 3, 5, 7, 9], 9) == 4

      assert binary_search([1, 3, 5, 7, 9], 4) == -1

      assert binary_search([], 3) == -1

      ```


