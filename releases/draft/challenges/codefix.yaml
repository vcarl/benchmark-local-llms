  - name: codefix_merge_intervals_s0
    family: codefix_merge_intervals
    seed: 0
    scope: core
    category: code
    tier: 2
    prompt: >-
      `merge_intervals(intervals)` takes a list of `[start, end]` pairs (start
      <= end) and returns the merged intervals as `[start, end]` lists sorted by
      start. Intervals that overlap or touch (one ends where the next starts)
      merge.


      The implementation below has a bug: it fails at least one of the tests
      shown. Fix it so every test passes. The fixed function is also run against
      held-out tests of the same behavior, so fix the bug itself rather than
      special-casing these tests.


      ```python

      def merge_intervals(intervals):
          merged = []
          for start, end in sorted(intervals):
              if merged and start <= merged[-1][1]:
                  merged[-1][1] = max(merged[+1][1], end)
              else:
                  merged.append([start, end])
          return merged
      ```


      Tests:


      ```python

      assert merge_intervals([[1, 3], [2, 6], [8, 10]]) == [[1, 6], [8, 10]]

      assert merge_intervals([[5, 7], [1, 2]]) == [[1, 2], [5, 7]]

      assert merge_intervals([[1, 4], [4, 5]]) == [[1, 5]]

      assert merge_intervals([[1, 10], [2, 3]]) == [[1, 10]]

      assert merge_intervals([]) == []

      ```


