  # P = Σ_good λ^age, N = Σ_bad λ^age (age 0 = round 10); (P+1)/(P+N+2) = 0.4043751954223694. Slips: no decay 0.5833, most recent weighted λ 0.4112, prior decayed 0.3679, no prior 0.3615. gold: 0.4044
  - name: trust_decay_posterior
    seed: 0
    scope: stretch
    category: trust
    tier: 4
    prompt: >-
      You track an agent's reliability θ (the probability that an interaction
      with it goes well) with a Beta(1, 1) prior, one interaction per round. Its
      record, oldest first:

      Round 1: good

      Round 2: good

      Round 3: good

      Round 4: good

      Round 5: good

      Round 6: bad

      Round 7: good

      Round 8: bad

      Round 9: bad

      Round 10: bad

      You use exponential forgetting with λ = 0.8: an interaction k rounds
      before the most recent one carries weight λ^k, so the most recent
      interaction has weight 1. With P the total weight of good interactions and
      N the total weight of bad ones, the posterior mean of θ is (P + 1)/(P + N
      + 2); the prior's pseudo-counts do not decay. What is the posterior mean
      of θ after round 10? Give it rounded to 4 decimal places. Reply with only
      the number.
    scorer: exact_match
    expected: "0.4044"
    extract: (-?\d*\.?\d+)
    tags:
      - trust
      - bayesian-trust
    nearMisses:
      - slip: truncated
        credit: 0.5
        expected: "0.4043"
    family: trust_decay
