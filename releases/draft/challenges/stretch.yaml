  # P1: collect 8004000, senior int 988000, par 53000000/A 49400000 < 125% → cure 7000000, junior 16000. P2: A 42400000, collect 7140000, senior int 848000, divert 5520000, junior 410000. No OC test gives 820000; diverting all junior cash gives 0. gold: 426000
