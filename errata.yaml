# Errata registry: every change to an item since the last prompt release.
# `npm test` (src/config/errata.test.ts) fails when an item differs from
# release-baseline.json without an entry here. See docs/ERRATA.md.
#
#   kind:         answer-key | scorer | prompt-ambiguity | retired | added
#   items:        challengeId/itemName of every affected item
#   scorerChange: true when the entry changed how stored outputs score
#   promptFix:    none | pending-next-release | fixed-in-release (+ release: <label>)
