name: effect_constructors_structured
category: effect-ts
tier: 2
prompt: |-
  In Effect-TS, match each use case to the correct constructor:
  1. Wrap a pure value: Effect.???
  2. Create a failed Effect: Effect.???
  3. Wrap a side-effectful sync function: Effect.???
  4. Do nothing (unit): Effect.???

  Reply as JSON, using the full constructor name as each value: {"pure": "Effect.xxx", "fail": "Effect.xxx", "sync": "Effect.xxx", "unit": "Effect.xxx"}
  Output only the JSON object, no extra text.
scorer: constraint
constraints:
- name: valid JSON
  check: valid_json
- name: pure = Effect.succeed
  check: regex
  pattern: '"pure"\s*:\s*"Effect\.succeed"'
- name: fail = Effect.fail
  check: regex
  pattern: '"fail"\s*:\s*"Effect\.fail"'
- name: sync = Effect.sync
  check: regex
  pattern: '"sync"\s*:\s*"Effect\.sync"'
- name: unit = Effect.void or Effect.unit
  check: regex
  pattern: '"unit"\s*:\s*"Effect\.(void|unit)"'
tags:
  - TODO
  - code-synthesis
