# ── Small models at vendor-recommended sampling (oMLX) ───────────────────────
# Earlier mlx/llamacpp runs of these used server-default sampling and, for the
# 0.8B/2B, a 2048 cap that truncated ~80% of thinking. These entries use the
# same MLX weights with the vendor's published thinking-mode settings and a
# 32768-token budget (the cards' "most queries" length). Sources:
#  - Qwen3.5 0.8B/2B/9B cards (huggingface.co/Qwen/Qwen3.5-*): "output length
#    of 32,768 tokens for most queries". 9B's template thinks by default, so it
#    takes the thinking set "temperature=1.0, top_p=0.95, top_k=20, min_p=0.0,
#    presence_penalty=1.5". The 0.8B/2B templates emit an empty <think></think>
#    unless enable_thinking is passed (the harness never passes it), so they
#    take the non-thinking set: temperature 0.7, top_p 0.8, top_k 20, min_p 0,
#    presence_penalty 1.5.
#  - gemma-4-E4B-it card (huggingface.co/google/gemma-4-E4B-it): "temperature=1.0,
#    top_p=0.95, top_k=64"; no output-length guidance, so the 32768 cap. The card
#    enables thinking via <|think|> in the system prompt; systemPrompt stays default.
#  - DeepSeek-R1-0528-Qwen3-8B card: temperature 0.6, top-p 0.95, "maximum
#    generation length is set to 64K tokens" (capped here at 32768).
#  - gpt-oss-20b: github.com/openai/gpt-oss README, "We recommend sampling with
#    temperature=1.0 and top_p=1.0".

