# ── Flint (Recursive) and Cyber-Tiel-Coder — reasoning MoEs at vendor settings ──
# Both are reasoning models whose cards ask for a >=32k output budget
# (reasoning included); an 8192 cap truncates them mid-thought. Sampling is
# each model card's recommended set, not the harness default. ctxSize is
# pinned because llama-server otherwise allocates the full 262k native window.
#
# Flint (RecursiveSI/flint): 40B total / 2.5B active, trained from scratch.
# Card: temperature 1.0, top_p 0.95, top_k 20; Unsloth adds min_p 0.0.
# Needs a llama.cpp with FlintForCausalLM (merged 2026-10-21, ggml-org#30928).
- id: flint-llamacpp
  artifact: unsloth/flint-GGUF
  runtime: llamacpp
  quant: Q8_0
  temperature: 1.0
  topP: 0.95
  topK: 20
  minP: 0.0
  systemPrompt: default
  maxTokens: 32768
  ctxSize: 65536

# Cyber-Tiel-Coder-35B-A3B: abliterated Ornith-1.5-35B-A3B (qwen35moe hybrid).
