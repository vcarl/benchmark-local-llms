# ── MLX corpus at vendor-recommended sampling (oMLX) ─────────────────────────
# oMLX twins of every mlx entry with results (the small models above excepted).
# mlx_lm.server samples with top_p 1.0, top_k off, min_p 0 and no penalty;
# these entries change sampling only — same weights, systemPrompt and maxTokens
# as the mlx entry. "Thinking" is the template's behavior without
# enable_thinking (the harness never passes it), which picks the card's set.
# Sources (huggingface.co/<repo>, card unless generation_config.json is named):
#  - Qwen/Qwen2.5-{7B,32B}-Instruct: card gives none; generation_config.json
#    ships temperature 0.7, top_p 0.8, top_k 20, repetition_penalty 1.05.
#  - meta-llama/Llama-3.1-8B-Instruct: card gives none; generation_config.json
#    (read via the ungated unsloth mirror) ships temperature 0.6, top_p 0.9.
#  - microsoft/phi-4: card metadata `inference: parameters: temperature: 0`;
#    generation_config.json sets nothing.
#  - deepseek-ai/DeepSeek-R1-Distill-Qwen-7B (thinks; template opens <think>):
#    "temperature within the range of 0.5-0.7 (0.6 is recommended)", top-p 0.95.
#  - Qwen/Qwen3-32B (thinks by default): thinking set "Temperature=0.6,
#    TopP=0.95, TopK=20, and MinP=0".
#  - Qwen/QwQ-32B (thinks): "Temperature=0.6, TopP=0.95, MinP=0", "TopK between
#    20 and 40"; top_k 40 is the generation_config.json value.
#  - Qwen/Qwen3-Coder-30B-A3B-Instruct (non-thinking only): "temperature=0.7,
#    top_p=0.8, top_k=20, repetition_penalty=1.05".
#  - Qwen/Qwen3-Coder-Next (non-thinking only): "temperature=1.0, top_p=0.95,
#    top_k=40".
#  - Qwen/Qwen3.5-{27B,35B-A3B,122B-A10B} (template opens <think>): thinking
#    general set "temperature=1.0, top_p=0.95, top_k=20, min_p=0.0,
#    presence_penalty=1.5, repetition_penalty=1.0".
#  - Qwen/Qwen3.6-35B-A3B (thinks): the same set, presence_penalty 1.5.
#  - Qwen/Qwen3.6-27B (thinks): "temperature=1.0, top_p=0.95, top_k=20,
#    min_p=0.0, presence_penalty=0.0, repetition_penalty=1.0" (penalties are
#    server defaults, so unset).
#  - google/gemma-4-{26B-A4B,31B}-it: "temperature=1.0, top_p=0.95, top_k=64".
#    Without <|think|> in the system prompt the template emits an empty thought
#    channel, so these run non-thinking; the card has one set for both.
#  - zai-org/GLM-4.7-Flash (template opens <think>): default "temperature: 1.0,
#    top-p: 0.95".
#  - mistralai/Magistral-Small-2509: "temperature: 0.7, top_p: 0.95". The card
#    supplies its reasoning instruction via a recommended system prompt;
#    systemPrompt stays default.
#  - mistralai/Mistral-Small-3.2-24B-Instruct-2506: "temperature=0.15".
#  - mistralai/Devstral-Small-2-24B-Instruct-2512: no stated recommendation;
#    generation_config.json and every card example use temperature 0.15.
#  - tencent/Hunyuan-A13B-Instruct ("defaults to using slow-thinking"): card
#    gives none; generation_config.json ships temperature 0.7, top_p 0.8,
#    top_k 20, repetition_penalty 1.05.
#  - ByteDance-Seed/Seed-OSS-36B-Instruct (thinking_budget -1, unlimited
#    thinking by default): "temperature=1.1 and top_p=0.95".
# oMLX has no --trust-remote-code flag, so the mlx entries' extraArgs are not
# carried over. Kimi-Linear-48B-A3B has no twin: its repo ships custom model
# code and oMLX refuses to load it ("Please pass the argument
# `trust_remote_code=True`"). Hunyuan-A13B carries custom code too and may fail
# the same way.
#
# Entries marked `active: false` have weights that are no longer cached, so they
# have not been load-tested on oMLX; fetch the artifact, then flip them on.

