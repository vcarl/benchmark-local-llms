# ── Qwen 3.8 27B (dense) — mlx vs oMLX across three quants ───────────────────
# Qwen3.8-27B ships as a vision-language checkpoint (`model_type: qwen3_5`,
# with `vision_config` + `text_config`). Both runtimes serve it as text: mlx_lm
# loads only the language backbone, oMLX routes it to its VLM engine. The
# MTP sibling (`mlx-community/Qwen3.8-27B-MTP-4bit`) is a speculative-decoding
# draft head, not a chat model, so it is deliberately absent.
- id: qwen3.8-27b-mlx
  artifact: mlx-community/Qwen3.8-27B-4bit
  runtime: mlx
  quant: 4bit
  temperature: 0.7
  systemPrompt: default
  maxTokens: 8192
  # mlx_lm leaves repetition_penalty at 0.0 (off), and this model
  # collapses into verbatim repetition on the financial reasoning items;
  # the same weights served by omlx do not. 1.05 is measured, not guessed:
  # against 1.15 over the same 26 items it scored 15 perfect to 12 and
  # looped once to 6. The firmer setting did not suppress the cycles, it
  # induced new ones on the contagion items, where the model has to restate
  # running balances and a heavy penalty pushes it off its own arithmetic.
  repetitionPenalty: 1.05
  repetitionContextSize: 64

- id: qwen3.8-27b-omlx
  artifact: mlx-community/Qwen3.8-27B-4bit
  runtime: omlx
  quant: 4bit
  temperature: 0.7
  systemPrompt: default
  maxTokens: 8192

- id: qwen3.8-27b-mlx-5bit
  artifact: lmstudio-community/Qwen3.8-27B-MLX-5bit
  runtime: mlx
  quant: 5bit
  temperature: 0.7
  systemPrompt: default
  maxTokens: 8192
  # mlx_lm leaves repetition_penalty at 0.0 (off), and this model
  # collapses into verbatim repetition on the financial reasoning items;
  # the same weights served by omlx do not. 1.05 is measured, not guessed:
  # against 1.15 over the same 26 items it scored 15 perfect to 12 and
  # looped once to 6. The firmer setting did not suppress the cycles, it
  # induced new ones on the contagion items, where the model has to restate
