# ── Batch 1 of late-2026 releases — reasoning models at vendor settings ──────
# All six think by default when enable_thinking is not passed (the harness
# never passes it) except Gemma 4, so each takes its card's thinking-mode set.
# 32768-token budget as for Flint/Cyber-Tiel. 4-bit-class weights throughout.
#
# Qwen3.8-Flash-Next (125B total / 6B active, qwen4exp; llama.cpp support
# merged 2026-08-27, ggml-org#27742). Card (huggingface.co/Qwen/Qwen3.8-Flash-Next)
# thinking mode: temperature 1.0, top_p 0.95, top_k 20, min_p 0.0,
# presence_penalty 0.0. UD-IQ4_XS (93.7 GB) leaves ~34 GB for KV/OS; the 107 GB
# oQ4e MLX build would not.
- id: qwen3.8-flash-next-llamacpp
  artifact: unsloth/Qwen3.8-Flash-Next-GGUF
  runtime: llamacpp
  quant: UD-IQ4_XS
  temperature: 1.0
  topP: 0.95
  topK: 20
  minP: 0.0
  systemPrompt: default
  maxTokens: 32768
  ctxSize: 65536

